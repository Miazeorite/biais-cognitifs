 confirment ce qu'il pense déjà, au moment de chercher, d'interpréter et de se souvenir.", "tips": ["Chercher activement des arguments contre sa propre position.", "Se demander : « Quelle information me ferait changer d'avis ? », puis la chercher."]}, "Biais de congruence": {"ex": [["Science", "Un chercheur teste uniquement sa théorie préférée, sans tester les explications concurrentes."], ["Santé", "Un médecin fait les examens qui confirment son hypothèse, mais pas ceux qui pourraient l'écarter."], ["Vie quotidienne", "Pour vérifier qu'une plante a besoin de soleil, on la met au soleil, sans jamais en laisser une autre à l'ombre pour comparer."]], "why": "Il est plus naturel de chercher des cas où notre idée marche que des cas où elle échouerait. Pourtant, seule la comparaison avec d'autres hypothèses permet de savoir si on a raison.", "tips": ["Pour chaque hypothèse, formuler au moins une explication concurrente et la tester.", "Chercher le test qui pourrait prouver qu'on a tort."]}, "Rationalisation post-achat": {"ex": [["Consommation", "Après un téléphone hors de prix, on se répète que l'appareil photo est exceptionnel."], ["Logement", "Après avoir acheté une maison loin de tout, on vante le calme de la campagne."], ["Travail", "Après avoir accepté un poste décevant, on insiste sur les « belles perspectives d'évolution »."]], "why": "Un choix coûteux qui serait mauvais crée un inconfort (une dissonance). Pour le réduire, on se persuade que c'était le bon choix plutôt que de reconnaître une erreur.", "tips": ["Écrire avant un achat important ce qu'on en attend, pour le comparer honnêtement ensuite.", "Accepter qu'un mauvais achat ne fait pas de nous quelqu'un de bête."]}, "Biais de soutien du choix": {"ex": [["Éducation", "Des années plus tard, on se souvient de l'école choisie comme bien meilleure que celle refusée."], ["Relations", "Après une rupture qu'on a décidée, on se rappelle surtout les défauts de l'ex."], ["Consommation", "On se souvient de la voiture achetée avec plus de qualités qu'elle n'en avait au moment du choix."]], "why": "Notre mémoire n'enregistre pas fidèlement : elle se réécrit pour que nos décisions passées paraissent bonnes, ce qui protège l'image qu'on a de soi.", "tips": ["Garder une trace écrite des avantages et inconvénients au moment de décider.", "Relire ces notes avant de juger, avec le recul, si on a bien choisi."]}, "Perception sélective": {"ex": [["Sport", "Les supporters de chaque équipe voient surtout les fautes de l'équipe adverse."], ["Politique", "Après un débat, chaque camp est persuadé que son candidat a gagné."], ["Éducation", "Un enseignant remarque les progrès de l'élève qu'il apprécie et pas ceux des autres."]], "why": "Nos attentes et nos préférences filtrent ce que nous percevons. Ce qui dérange nos croyances est moins remarqué et plus vite oublié, ce qui nous évite un inconfort.", "tips": ["Revoir une situation en adoptant volontairement le point de vue de l'autre camp.", "Demander à une personne neutre ce qu'elle a observé."]}, "Attente de l'expérimentateur": {"ex": [["Science", "Le cheval Hans semblait savoir compter : il réagissait en fait aux signes involontaires de son maître."], ["Éducation", "Des élèves présentés comme « prometteurs » progressent davantage, parce que l'enseignant se comporte autrement avec eux."], ["Santé", "Un médecin qui croit à un traitement encourage involontairement ses patients à décrire une amélioration."]], "why": "Nos attentes se traduisent par de petits signaux (ton, regard, encouragements) qui orientent le comportement des autres, sans que personne ne s'en rende compte.", "tips": ["Quand c'est possible, travailler « en aveugle » : ne pas savoir qui reçoit quel traitement.", "Standardiser les consignes et les questions pour tout le monde."]}, "Biais de l'expérimentateur": {"ex": [["Science", "Un chercheur relance l'analyse quand les résultats déçoivent, mais jamais quand ils confirment son hypothèse."], ["Santé", "Une étude financée par un laboratoire interprète des résultats mitigés de façon favorable."], ["Travail", "Un manager évalue un projet pilote qu'il a lui-même lancé plus positivement qu'il ne le devrait."]], "why": "On a investi du temps, de l'énergie et parfois sa réputation dans une hypothèse. Le cerveau traite donc plus sévèrement les résultats qui la contredisent.", "tips": ["Définir à l'avance comment on analysera les données (préenregistrement).", "Faire relire ses résultats par quelqu'un qui n'a pas d'intérêt dans la conclusion."]}, "Effet de l'observateur": {"ex": [["Travail", "Des salariés travaillent plus vite le jour où un consultant vient les observer."], ["Santé", "Des patients prennent mieux leur traitement quand ils savent qu'on surveille leur prise."], ["Éducation", "Une classe se tient bien mieux pendant l'inspection."]], "why": "Se savoir observé change ce qu'on fait : on veut donner une bonne image, ou on fait plus attention. L'observation modifie donc ce qu'elle mesure.", "tips": ["Observer sur une longue durée, pour que les gens s'habituent à la présence de l'observateur.", "Croiser l'observation avec des données recueillies sans présence visible."]}, "Biais d'attente": {"ex": [["Consommation", "Un dégustateur trouve un vin meilleur quand on lui dit qu'il coûte cher."], ["Science", "Un chercheur lit un résultat ambigu comme une confirmation de ce qu'il attendait."], ["Santé", "Un patient qui s'attend à des effets secondaires en ressent davantage (effet nocebo)."]], "why": "Le cerveau ne reçoit pas passivement l'information : il anticipe, et ses attentes orientent l'interprétation de ce qu'il perçoit.", "tips": ["Évaluer sans connaître les informations qui créent des attentes (prix, marque, auteur).", "Noter ses attentes avant l'observation pour les comparer au résultat."]}, "Effet de l'autruche": {"ex": [["Finance", "Quand la Bourse baisse, beaucoup d'épargnants évitent de consulter leur compte."], ["Santé", "On repousse un examen médical par peur d'apprendre une mauvaise nouvelle."], ["Travail", "On n'ouvre pas les retours sur un projet de peur qu'ils soient négatifs."]], "why": "Une information négative fait souffrir tout de suite, alors que ses bénéfices (pouvoir agir) sont plus lointains. Éviter de savoir soulage à court terme.", "tips": ["Programmer à l'avance des moments réguliers pour vérifier (comptes, santé, retours).", "Se rappeler qu'ignorer un problème ne le fait pas disparaître, mais retarde la solution."]}, "Validation subjective": {"ex": [["Croyances", "On trouve son horoscope juste parce qu'une phrase fait écho à sa semaine."], ["Croyances", "Lors d'une séance de voyance, on retient les affirmations qui tombent juste et on oublie les autres."], ["Relations", "On voit un signe dans une coïncidence parce qu'elle concerne quelqu'un qui compte pour nous."]], "why": "Ce qui nous concerne personnellement nous paraît plus significatif. Le cerveau cherche du sens et relie spontanément des informations vagues à sa propre histoire.", "tips": ["Se demander si l'affirmation s'appliquerait aussi à n'importe qui d'autre.", "Compter aussi les fois où « ça n'a pas marché »."]}, "Effet de l'influence continue": {"ex": [["Médias", "Même après un démenti officiel, une rumeur continue d'orienter l'opinion du public."], ["Santé", "L'idée que les vaccins causent l'autisme persiste malgré le retrait de l'étude frauduleuse qui l'avait lancée."], ["Justice", "Des jurés restent influencés par une preuve qu'on leur a demandé d'ignorer."]], "why": "Une information fausse s'intègre à l'explication qu'on se fait d'un événement. La retirer laisse un « trou » dans l'histoire, et le cerveau préfère une explication fausse à pas d'explication du tout.", "tips": ["Quand on corrige une fausse information, proposer une explication alternative pour la remplacer.", "Se demander si l'on raisonne encore à partir d'une information qui a été démentie."]}, "Réflexe de Semmelweis": {"ex": [["Santé", "Au XIXᵉ siècle, des médecins rejettent l'idée de se laver les mains entre deux accouchements, pourtant démontrée par Semmelweis."], ["Science", "La dérive des continents a longtemps été rejetée parce qu'elle contredisait la géologie de l'époque."], ["Travail", "Une entreprise écarte une innovation qui remet en cause son modèle habituel."]], "why": "Une idée nouvelle qui contredit les normes établies menace les habitudes, l'expertise et parfois l'ego de ceux qui les défendent. Il est plus confortable de la rejeter que de tout remettre en question.", "tips": ["Évaluer une idée sur ses preuves, pas sur sa conformité avec ce qu'on pense déjà.", "Se demander : « Qu'est-ce que je perdrais si cette idée était vraie ? »"]}, "Biais de l'angle mort": {"ex": [["Vie quotidienne", "« Lui est influencé par la pub. Moi, non. »"], ["Politique", "Chaque camp pense que l'autre est biaisé et que lui voit les faits objectivement."], ["Travail", "Un recruteur est persuadé de juger les candidats sans préjugés, contrairement à ses collègues."]], "why": "On observe le comportement des autres de l'extérieur, mais on juge le sien par l'introspection, à partir de ses intentions. Or la plupart des biais ne sont pas accessibles par introspection.", "tips": ["Partir du principe qu'on est soumis aux mêmes biais que tout le monde.", "Utiliser des procédures (grilles, critères fixés à l'avance) plutôt que se fier à sa propre impartialité."]}, "Cynisme naïf": {"ex": [["Relations", "« S'il est gentil avec moi, c'est forcément qu'il veut quelque chose. »"], ["Travail", "Lors d'une négociation, on interprète chaque concession de l'autre comme une ruse."], ["Politique", "On suppose que les élus du camp adverse agissent uniquement par intérêt personnel."]], "why": "On croit voir le monde objectivement ; si les autres ne voient pas les choses comme nous, c'est qu'ils doivent être influencés par leur intérêt. On leur prête donc plus d'égoïsme qu'ils n'en ont.", "tips": ["Envisager au moins une explication bienveillante au comportement de l'autre.", "Demander directement les raisons d'un geste plutôt que de les supposer."]}, "Réalisme naïf": {"ex": [["Politique", "« Je vois les choses telles qu'elles sont ; s'il pense le contraire, c'est qu'il est mal informé ou de mauvaise foi. »"], ["Relations", "Dans une dispute de couple, chacun est sûr que l'autre déforme la réalité."], ["Travail", "Deux équipes ne comprennent pas pourquoi l'autre ne voit pas « l'évidence »."]], "why": "Notre perception nous semble être un reflet direct de la réalité, et non une interprétation. Le désaccord ne peut alors s'expliquer que par l'ignorance, l'irrationalité ou les biais des autres.", "tips": ["Se rappeler que chacun interprète la réalité depuis sa propre position.", "Reformuler le point de vue de l'autre jusqu'à ce qu'il le reconnaisse comme juste, avant de répondre."]}, "Confabulation": {"ex": [["Psychologie", "Des participants justifient avec assurance un choix qu'ils n'ont pas fait, quand on échange leur choix à leur insu."], ["Santé", "Des patients atteints de certaines lésions cérébrales racontent sincèrement des souvenirs inventés."], ["Vie quotidienne", "On explique sans hésiter pourquoi on a acheté un produit, alors que la vraie raison nous échappe."]], "why": "Le cerveau n'a pas accès à toutes les causes de nos actes, mais il a besoin d'une histoire cohérente. Il comble alors les trous avec des explications plausibles, sans intention de mentir.", "tips": ["Se méfier des explications trop rapides de ses propres choix.", "Vérifier ses souvenirs importants auprès d'autres sources (traces écrites, témoins)."]}, "Illusion des séries": {"ex": [["Histoire", "Pendant la guerre, des Londoniens voyaient des zones visées exprès par les bombes, alors que les impacts étaient répartis au hasard."], ["Santé", "Plusieurs cas d'une maladie dans un même quartier font craindre une cause commune, alors que ce regroupement peut être dû au hasard."], ["Finance", "Un investisseur voit des « tendances » dans des variations boursières aléatoires."]], "why": "Le hasard produit naturellement des regroupements, mais notre intuition imagine un hasard « bien réparti ». Quand des éléments se regroupent, le cerveau suppose une cause.", "tips": ["Se demander : « À quoi ressemblerait ce résultat s'il était dû au hasard ? »", "Attendre davantage de données avant de conclure à un schéma."]}, "Insensibilité à la taille du groupe": {"ex": [["Santé", "Un traitement testé sur 10 personnes paraît aussi convaincant qu'un traitement testé sur 10 000."], ["Éducation", "Les meilleures écoles d'un classement sont souvent de petites écoles, mais les plus mauvaises aussi : les petits effectifs varient plus."], ["Consommation", "Un produit noté 5/5 par 3 avis paraît meilleur qu'un produit noté 4,6/5 par 2 000 avis."]], "why": "Le cerveau retient le résultat (la moyenne, le pourcentage) mais pas la quantité de données qui le soutient. Or plus un échantillon est petit, plus ses résultats peuvent être extrêmes par hasard.", "tips": ["Toujours demander : « Sur combien de cas ? »", "Se méfier des résultats spectaculaires obtenus sur de petits groupes."]}, "Négligence des probabilités": {"ex": [["Médias", "Après un attentat, on renonce à l'avion pour la voiture, qui est pourtant bien plus dangereuse."], ["Santé", "On craint davantage un effet secondaire rarissime qu'une maladie bien plus fréquente."], ["Jeux", "On achète un billet de loto en imaginant le gain, sans penser à la probabilité infime de gagner."]], "why": "Quand une issue est très chargée en émotion (peur, espoir), le cerveau se concentre sur elle et non sur sa probabilité. Les petits risques sont alors soit ignorés, soit énormément surestimés.", "tips": ["Traduire le risque en chiffres concrets : « 1 chance sur combien ? »", "Comparer avec des risques connus de la vie quotidienne."]}, "Erreur de la preuve anecdotique": {"ex": [["Santé", "« Mon grand-père a fumé toute sa vie et il a vécu jusqu'à 95 ans. »"], ["Consommation", "Un seul témoignage enthousiaste sur un produit pèse plus que des statistiques de satisfaction."], ["Politique", "Un fait divers devient l'argument principal d'une loi, sans regarder les tendances générales."]], "why": "Une histoire concrète est vivante, émouvante et facile à retenir, alors que les statistiques sont abstraites. Le cerveau donne plus de poids à ce qui est vivant qu'à ce qui est représentatif.", "tips": ["Se demander si le cas raconté est typique ou exceptionnel.", "Chercher des données sur l'ensemble des cas avant de généraliser."]}, "Illusion de la validité": {"ex": [["Travail", "Un recruteur reste sûr de son jugement après vingt minutes d'entretien, malgré des prédictions souvent fausses."], ["Finance", "Un gérant est convaincu de pouvoir choisir les meilleures actions, alors que ses résultats ne battent pas le marché."], ["Sport", "Des recruteurs sont certains de repérer les futurs champions à partir de quelques matchs."]], "why": "Quand les informations forment une histoire cohérente, on ressent une forte confiance, même si ces informations prédisent mal l'avenir. La cohérence remplace la vérification.", "tips": ["Comparer ses prédictions passées avec ce qui s'est réellement passé.", "Utiliser des critères objectifs et des grilles plutôt que l'intuition seule."]}, "Erreur de l'homme masqué": {"ex": [["Logique", "« Je connais mon père ; je ne connais pas l'homme masqué ; donc l'homme masqué n'est pas mon père. »"], ["Justice", "« Le témoin croit que le suspect était à Paris ; il ne croit pas que le voleur était à Paris ; donc le suspect n'est pas le voleur. »"], ["Vie quotidienne", "« Je sais que Superman sait voler, je ne sais pas si Clark Kent sait voler : ils ne peuvent pas être la même personne. »"]], "why": "On confond ce qu'on sait d'une chose avec ce qu'elle est réellement. Nos connaissances sont incomplètes : ne pas savoir que deux choses sont identiques ne prouve pas qu'elles sont différentes.", "tips": ["Distinguer « je ne sais pas que c'est vrai » de « c'est faux ».", "Vérifier si deux descriptions différentes peuvent désigner la même chose."]}, "Illusion de la récence": {"ex": [["Langue", "On croit que « malgré que » est une faute récente, alors qu'on la trouve déjà chez Proust et Gide."], ["Société", "On pense que l'impolitesse des jeunes est un phénomène nouveau, alors que la plainte existe depuis l'Antiquité."], ["Médias", "Un mot qu'on vient de remarquer semble être une invention à la mode."]], "why": "On confond le moment où l'on remarque une chose avec le moment où elle est apparue. Ce qui est nouveau pour nous paraît nouveau tout court.", "tips": ["Vérifier l'histoire d'un phénomène avant de le déclarer récent.", "Se demander : « Est-ce nouveau, ou est-ce que je viens seulement de le remarquer ? »"]}, "Erreur du parieur": {"ex": [["Jeux", "Après cinq « rouge » à la roulette, on mise sur « noir »."], ["Santé", "Des parents qui ont eu trois garçons pensent que le prochain enfant sera « forcément » une fille."], ["Justice", "Des études suggèrent que des juges accordent moins souvent l'asile juste après l'avoir accordé plusieurs fois de suite."]], "why": "On imagine que le hasard s'équilibre à court terme, comme s'il avait une mémoire. En réalité, des événements indépendants n'influencent pas les suivants.", "tips": ["Se rappeler que chaque tirage indépendant repart de zéro.", "Dans les décisions en série, évaluer chaque cas pour lui-même."]}, "Erreur de la main chaude": {"ex": [["Sport", "Au basket, on passe le ballon au joueur qui vient de marquer trois paniers, persuadé qu'il va marquer encore."], ["Finance", "On confie son argent au gérant qui a eu une bonne année, en pensant qu'il est « en forme »."], ["Jeux", "Un joueur qui gagne plusieurs fois au casino se croit dans une « bonne série »."]], "why": "Le cerveau cherche des séries et des causes. Une suite de succès donne l'impression d'un état particulier qui va durer. Les recherches récentes montrent qu'un effet réel mais faible existe parfois dans le sport, mais on le surestime largement.", "tips": ["Regarder les résultats sur une longue période, pas seulement la série récente.", "Distinguer les activités où le talent compte de celles qui relèvent surtout du hasard."]}, "Corrélation illusoire": {"ex": [["Santé", "On est convaincu qu'il y a plus d'urgences les soirs de pleine lune."], ["Société", "Quelques faits divers impliquant un groupe minoritaire suffisent à lui associer un comportement."], ["Vie quotidienne", "On croit que son « porte-bonheur » améliore ses résultats."]], "why": "Les événements rares ou marquants attirent l'attention, et quand deux d'entre eux arrivent ensemble, on les relie. On oublie de compter les fois où ils n'arrivent pas ensemble.", "tips": ["Faire un tableau à quatre cases : quand A et B arrivent ensemble, A sans B, B sans A, ni l'un ni l'autre.", "Chercher des données systématiques avant de conclure à un lien."]}, "Paréidolie": {"ex": [["Vie quotidienne", "On voit un visage dans une prise électrique, une façade ou un nuage."], ["Croyances", "Certains voient des visages de saints dans une tache ou une tartine grillée."], ["Astronomie", "Une colline martienne photographiée en 1976 a été prise pour un « visage sur Mars »."]], "why": "Repérer un visage très vite était vital pour nos ancêtres. Le cerveau préfère voir un visage là où il n'y en a pas plutôt que de rater un vrai visage.", "tips": ["S'amuser de ces visages, mais ne pas leur prêter de signification.", "Face à une « image cachée », chercher d'abord l'explication la plus simple."]}, "Erreur d'attribution de groupe": {"ex": [["Société", "Un client a été désagréable : on en conclut que « les gens de cette ville sont tous impolis »."], ["Politique", "On croit qu'une décision votée de justesse reflète l'opinion de chaque membre de l'assemblée."], ["Travail", "On suppose que tous les employés d'un service partagent la position de leur chef."]], "why": "Pour simplifier un monde complexe, le cerveau traite les groupes comme s'ils étaient des individus homogènes, avec une seule personnalité et une seule opinion.", "tips": ["Se rappeler qu'un groupe est fait de personnes différentes.", "Distinguer la décision d'un groupe de l'avis de chacun de ses membres."]}, "Erreur ultime d'attribution": {"ex": [["Sport", "Si notre équipe perd, c'est la malchance ; si l'équipe adverse perd, c'est qu'elle est mauvaise."], ["Société", "Quand un membre d'un autre groupe réussit, on parle de chance ou de « piston »."], ["Politique", "Les erreurs de notre camp sont des accidents, celles du camp adverse révèlent sa vraie nature."]], "why": "On veut garder une image positive de son groupe. On explique donc les bons comportements de son groupe par ses qualités, et ceux des autres par les circonstances, et inversement pour les mauvais comportements.", "tips": ["Appliquer la même explication quel que soit le groupe concerné.", "Se demander : « Comment j'expliquerais ce comportement s'il venait de mon camp ? »"]}, "Stéréotypage": {"ex": [["Technologie", "Supposer qu'une personne âgée ne sait pas se servir d'un smartphone."], ["Travail", "Proposer d'office les tâches administratives à la seule femme de l'équipe."], ["Éducation", "Un enseignant attend moins d'un élève à cause de son milieu social."]], "why": "Les catégories permettent au cerveau de traiter vite une grande quantité d'informations sur les gens. Mais elles remplacent l'observation de la personne réelle par des suppositions sur son groupe.", "tips": ["Se demander : « Qu'est-ce que je sais vraiment de cette personne-là ? »", "Chercher activement des contre-exemples au stéréotype."]}, "Essentialisme": {"ex": [["Société", "Croire qu'un enfant adopté aura forcément le caractère de ses parents biologiques."], ["Santé", "Penser qu'une personne qui a eu un trouble psychique « est » malade pour toujours."], ["Société", "Attribuer des différences de comportement entre hommes et femmes à une nature fixe plutôt qu'à l'éducation."]], "why": "Dès l'enfance, on suppose que les choses ont une « essence » cachée qui détermine ce qu'elles sont. C'est utile pour classer le monde, mais appliqué aux personnes, cela fige des différences souvent dues au contexte.", "tips": ["Se demander quelle part d'une différence vient de l'environnement ou de l'histoire.", "Éviter les formulations « ils sont comme ça par nature »."]}, "Fixité fonctionnelle": {"ex": [["Vie quotidienne", "Chercher un tournevis partout sans penser qu'une pièce de monnaie ferait l'affaire."], ["Science", "Dans l'expérience de Duncker, on peine à utiliser la boîte de punaises comme support pour la bougie."], ["Travail", "Une entreprise ne voit pas qu'un de ses produits pourrait répondre à un tout autre besoin."]], "why": "Une fois qu'on a appris à quoi sert un objet, cette fonction s'impose et bloque les autres usages possibles. L'expérience passée limite la créativité.", "tips": ["Décrire un objet par ses caractéristiques (rigide, plat, métallique) plutôt que par son usage.", "Demander l'avis de quelqu'un qui ne connaît pas le domaine."]}, "Effet d'hypocrisie morale": {"ex": [["Consommation", "Après avoir acheté un produit bio, on s'autorise un dessert supplémentaire."], ["Travail", "Un recruteur qui vient d'embaucher une personne issue d'une minorité se sent moins vigilant ensuite sur ses propres biais."], ["Santé", "Après une séance de sport, on se « récompense » par un repas très riche."]], "why": "Une bonne action renforce l'image positive qu'on a de soi, comme un crédit moral. On se sent alors autorisé à « dépenser » ce crédit dans un comportement moins vertueux.", "tips": ["Considérer chaque choix pour lui-même, sans compenser avec les précédents.", "Repérer les pensées du type « je l'ai bien mérité »."]}, "Croyance en un monde juste": {"ex": [["Société", "« S'il a perdu son emploi, c'est qu'il ne travaillait pas assez. »"], ["Justice", "Des victimes d'agression sont jugées en partie responsables de ce qui leur est arrivé."], ["Santé", "On pense qu'une personne malade a forcément eu une mauvaise hygiène de vie."]], "why": "Croire que chacun obtient ce qu'il mérite est rassurant : cela donne le sentiment de contrôler son propre destin. Pour préserver cette croyance, on finit parfois par blâmer les victimes.", "tips": ["Reconnaître la part de hasard et de circonstances dans ce qui arrive aux gens.", "Se demander : « Est-ce que j'accuse cette personne pour me rassurer ? »"]}, "Argument tiré d'un sophisme": {"ex": [["Débat", "Quelqu'un défend une idée avec un mauvais argument, donc on en conclut que l'idée est fausse."], ["Politique", "Un militant exagère un chiffre ; on rejette alors toute sa cause."], ["Santé", "Un défenseur d'un traitement dit une bêtise sur la chimie : on en déduit que le traitement ne marche pas."]], "why": "Repérer une faute de raisonnement donne le sentiment d'avoir gagné le débat. Mais une conclusion peut être vraie même quand elle est mal défendue.", "tips": ["Séparer la qualité de l'argument de la vérité de la conclusion.", "Chercher la meilleure version de l'argument adverse avant de le rejeter."]}, "Biais d'autorité": {"ex": [["Science", "Dans l'expérience de Milgram, des participants infligent des chocs qu'ils croient dangereux parce qu'un scientifique le leur demande."], ["Publicité", "Une publicité montre un acteur en blouse blanche pour vanter un dentifrice."], ["Santé", "Une infirmière hésite à contredire un médecin même face à une prescription visiblement erronée."]], "why": "Faire confiance aux experts est souvent raisonnable et fait gagner du temps. Mais le cerveau s'accroche aux signes extérieurs d'autorité (titre, uniforme) plus qu'à la qualité de ce qui est dit.", "tips": ["Évaluer ce qui est dit, pas seulement qui le dit.", "Vérifier que l'expert parle bien de son domaine de compétence."]}, "Biais d'automatisation": {"ex": [["Transport", "Un conducteur suit son GPS jusque dans un chemin impraticable alors que les panneaux indiquaient l'inverse."], ["Santé", "Un médecin suit l'alerte d'un logiciel sans vérifier, même quand les symptômes ne collent pas."], ["Numérique", "On accepte sans les relire les corrections automatiques ou les réponses d'une IA."]], "why": "Les machines paraissent objectives et fiables, et les suivre demande moins d'effort que de tout vérifier. L'attention se relâche dès qu'un système automatique prend le relais.", "tips": ["Garder des vérifications humaines, surtout pour les décisions importantes.", "Se demander : « Est-ce que ce résultat a du sens par rapport à ce que je vois ? »"]}, "Effet de mode": {"ex": [["Consommation", "On choisit le restaurant plein plutôt que celui d'à côté, vide."], ["Politique", "Des sondages favorables à un candidat attirent des électeurs indécis vers lui."], ["Finance", "Les bulles spéculatives grossissent parce que tout le monde achète ce que les autres achètent."]], "why": "Suivre le groupe est souvent un bon raccourci : si beaucoup de gens font quelque chose, c'est peut-être une bonne idée. C'est aussi un moyen d'être accepté socialement.", "tips": ["Se demander si l'on choisit pour ses propres raisons ou parce que « tout le monde le fait ».", "Chercher les raisons de la popularité avant de suivre."]}, "Effet placebo": {"ex": [["Santé", "Un comprimé de sucre soulage réellement le mal de tête de certains patients qui le croient efficace."], ["Santé", "Un médicament plus cher ou en gélule colorée paraît plus efficace qu'un générique identique."], ["Sport", "Un sportif qui croit avoir pris un produit dopant améliore ses performances."]], "why": "Les attentes ont des effets bien réels sur le corps (douleur, stress, ressenti). Croire qu'un traitement agit peut déclencher des mécanismes biologiques de soulagement.", "tips": ["Juger un traitement sur des essais contrôlés contre placebo, pas sur son propre ressenti.", "Se rappeler qu'une amélioration après un traitement ne prouve pas que le traitement en est la cause."]}, "Biais d'homogénéité d'exogroupe": {"ex": [["Société", "« Les supporters de l'autre club sont tous pareils », alors que les nôtres sont tous différents."], ["Politique", "On imagine les électeurs du parti adverse comme un bloc uniforme."], ["Travail", "Les jeunes recrues voient « les seniors » comme un groupe homogène, et inversement."]], "why": "On connaît beaucoup de membres de son propre groupe, avec leurs nuances. On connaît moins ceux des autres groupes, ce qui les fait paraître plus semblables entre eux.", "tips": ["Chercher à connaître plusieurs membres d'un groupe avant de le décrire.", "Remplacer « ils » par des exemples de personnes précises."]}, "Effet inter-races": {"ex": [["Justice", "Un témoin reconnaît moins bien le visage d'un suspect d'une autre origine que la sienne."], ["Technologie", "Des systèmes de reconnaissance faciale entraînés surtout sur certains visages se trompent plus souvent sur les autres."], ["Vie quotidienne", "Dans un pays étranger, on a l'impression que « tout le monde se ressemble »."]], "why": "On apprend à distinguer les visages à partir de ceux qu'on voit le plus souvent. Les traits utiles pour reconnaître les visages qu'on rencontre moins sont moins bien entraînés.", "tips": ["Dans un témoignage, préciser son degré de certitude, surtout pour des visages moins familiers.", "Varier les visages rencontrés, ce qui réduit l'effet."]}, "Favoritisme intragroupe": {"ex": [["Travail", "À CV égal, un recruteur préfère le candidat issu de la même école que lui."], ["Science", "Dans des expériences, des groupes formés au hasard (par tirage à pile ou face) favorisent déjà leurs membres."], ["Sport", "Les supporters jugent les fautes de leur équipe moins graves que celles des adversaires."]], "why": "Appartenir à un groupe nourrit l'estime de soi. Favoriser son groupe renforce ce sentiment, même quand le groupe a été formé de façon arbitraire.", "tips": ["Évaluer les personnes avec des critères définis à l'avance.", "Rendre les candidatures anonymes quand c'est possible."]}, "Effet de halo": {"ex": [["Travail", "Un candidat élégant et sûr de lui paraît aussi plus compétent."], ["Justice", "Des accusés jugés séduisants reçoivent en moyenne des peines plus légères."], ["Consommation", "Une marque appréciée pour un produit paraît bonne pour tous les autres."]], "why": "Une impression globale se forme très vite à partir d'un trait marquant, puis colore tout le reste. Le cerveau cherche la cohérence : quelqu'un de bien sur un point doit l'être sur les autres.", "tips": ["Évaluer chaque qualité séparément, avec des critères précis.", "Se demander : « Mon jugement sur ce point est-il influencé par autre chose ? »"]}, "Effet pom-pom girl": {"ex": [["Relations", "Sur une photo de groupe, chacun paraît plus séduisant que sur sa photo seul."], ["Numérique", "Sur les applications de rencontre, certains utilisent une photo de groupe pour paraître plus attirants."], ["Consommation", "Un produit présenté dans une gamme harmonieuse paraît plus beau que seul en rayon."]], "why": "Quand on voit un groupe, le cerveau calcule une moyenne des visages, et les visages moyens paraissent plus attirants. Chaque personne est perçue un peu plus proche de cette moyenne.", "tips": ["Juger une personne ou un objet seul, et pas seulement dans son ensemble.", "Se rappeler que l'effet existe mais reste modeste."]}, "Effet de positivité": {"ex": [["Santé", "Avec l'âge, on retient davantage les bons moments que les mauvais."], ["Relations", "On se souvient de ses vacances en famille comme plus harmonieuses qu'elles ne l'étaient."], ["Consommation", "Les personnes âgées retiennent mieux les avantages d'un produit que ses défauts."]], "why": "En vieillissant, on accorde plus d'importance au bien-être émotionnel et on oriente son attention vers le positif. Ce biais protège le moral, mais peut faire oublier des informations utiles.", "tips": ["Noter aussi les points négatifs d'une expérience pour s'en souvenir.", "Pour une décision importante, relire volontairement les inconvénients."]}, "Pas inventé ici": {"ex": [["Travail", "Une équipe refait de zéro un outil qui existe déjà ailleurs, parce qu'il ne vient pas d'elle."], ["Science", "Un laboratoire ignore une méthode efficace développée par une équipe concurrente."], ["Politique", "Un pays refuse une solution qui a fait ses preuves ailleurs parce qu'elle est « étrangère »."]], "why": "Ce qu'on a créé soi-même nous paraît plus fiable, et adopter les idées des autres peut sembler menacer notre compétence ou notre identité.", "tips": ["Chercher systématiquement ce qui existe déjà avant de créer.", "Évaluer une solution sur ses résultats, pas sur son origine."]}, "Dévaluation réactive": {"ex": [["Politique", "Un même plan de paix est jugé moins favorable quand on l'attribue au camp adverse."], ["Travail", "Une proposition de la direction est rejetée par les salariés, alors qu'elle serait acceptée si elle venait d'eux."], ["Relations", "Dans une dispute, on refuse la solution de l'autre même si on l'aurait proposée soi-même."]], "why": "Si l'adversaire propose quelque chose, on suppose que cela l'avantage, et donc que cela nous désavantage. On juge la source plutôt que le contenu.", "tips": ["Se demander : « Que penserais-je de cette proposition si elle venait de mon camp ? »", "Faire présenter les propositions par une personne neutre."]}, "Effet de la route familière": {"ex": [["Transport", "Le trajet habituel paraît plus court qu'un nouvel itinéraire, même plus rapide."], ["Vie quotidienne", "On garde le même chemin pour aller au travail sans jamais tester les autres."], ["Voyage", "Le retour d'une excursion semble plus court que l'aller."]], "why": "Un trajet connu demande moins d'attention et se découpe en repères familiers, ce qui raccourcit la durée perçue. L'inconnu paraît plus long parce qu'on le surveille davantage.", "tips": ["Comparer les temps de trajet avec une application ou un chronomètre.", "Tester de temps en temps un autre itinéraire."]}, "Comptabilité mentale": {"ex": [["Finance", "On dépense sans compter un remboursement d'impôts « tombé du ciel », mais on surveille chaque euro de son salaire."], ["Consommation", "On garde un livret d'épargne à 1 % tout en payant un crédit à 15 %."], ["Jeux", "Au casino, on mise plus facilement l'argent « gagné » que celui apporté."]], "why": "Pour s'organiser, le cerveau range l'argent dans des « cases » (loisirs, factures, cadeau). C'est pratique, mais on oublie que chaque euro vaut la même chose, quelle que soit sa case.", "tips": ["Se rappeler que l'argent est interchangeable : un euro reste un euro.", "Regarder l'ensemble de ses finances avant une décision importante."]}, "Erreur d'appel à la probabilité": {"ex": [["Numérique", "« Ce site pourrait être piraté, donc il va forcément l'être. »"], ["Santé", "« Ce médicament peut provoquer des effets secondaires, donc il va m'en provoquer. »"], ["Croyances", "« Il est possible que des extraterrestres nous aient visités, donc ils l'ont fait. »"]], "why": "Le cerveau confond facilement ce qui est imaginable avec ce qui est probable. Une possibilité frappante devient vite une certitude.", "tips": ["Distinguer « c'est possible » de « c'est probable » et de « c'est arrivé ».", "Demander des preuves que la chose s'est produite, pas seulement qu'elle pourrait se produire."]}, "Biais de normalité": {"ex": [["Catastrophes", "Des habitants refusent d'évacuer avant un ouragan parce que « ça n'est jamais arrivé ici »."], ["Santé", "Au début d'une épidémie, beaucoup minimisent le risque parce que la vie semble continuer normalement."], ["Sécurité", "Lors d'un incendie, des personnes finissent leur repas ou rassemblent leurs affaires avant de sortir."]], "why": "Le cerveau s'attend à ce que demain ressemble à hier. Face à une situation inédite, il a du mal à imaginer le pire et interprète les signaux d'alerte de façon rassurante.", "tips": ["Préparer un plan d'urgence à l'avance, pour ne pas avoir à décider sous le choc.", "Prendre les alertes officielles au sérieux, même quand tout paraît calme."]}, "Loi de Murphy": {"ex": [["Vie quotidienne", "La tartine tombe toujours du côté beurré : on oublie toutes les fois où elle est tombée de l'autre côté."], ["Transport", "La file d'à côté avance toujours plus vite que la nôtre."], ["Travail", "L'imprimante tombe en panne pile le jour où l'on doit rendre un dossier."]], "why": "Les échecs frustrants marquent davantage la mémoire que les situations où tout se passe bien. On se souvient donc surtout des fois où « ça a raté », ce qui donne l'impression que le sort s'acharne.", "tips": ["Compter aussi les fois où tout s'est bien passé.", "En ingénierie, s'en servir positivement : prévoir ce qui pourrait mal tourner."]}, "Biais de la somme nulle": {"ex": [["Politique", "Penser que si les immigrés trouvent du travail, il y en aura forcément moins pour les autres."], ["Travail", "Croire que si un collègue est augmenté, on le sera forcément moins."], ["Éducation", "Voir la réussite d'un autre élève comme un échec pour soi, même sans classement."]], "why": "Pendant la plus grande partie de l'histoire humaine, les ressources étaient limitées et partagées. Le cerveau voit donc spontanément les situations comme une compétition, même quand tout le monde peut y gagner.", "tips": ["Se demander si la ressource en jeu est vraiment limitée.", "Chercher les solutions où chacun peut gagner quelque chose."]}, "Biais du survivant": {"ex": [["Travail", "« Ils ont arrêté leurs études et sont devenus millionnaires » : on ne voit pas tous ceux pour qui ça n'a pas marché."], ["Histoire", "Pendant la Seconde Guerre mondiale, on voulait renforcer les avions là où les avions revenus avaient des impacts ; il fallait renforcer les autres zones, car les avions touchés là ne revenaient pas."], ["Culture", "« Les objets d'autrefois étaient plus solides » : seuls les objets solides ont survécu jusqu'à nous."]], "why": "Les échecs disparaissent souvent de notre vue, alors que les réussites sont visibles et racontées. On tire alors des conclusions à partir d'un échantillon incomplet.", "tips": ["Se demander : « Où sont ceux qui ont échoué ? Que diraient-ils ? »", "Chercher des données sur l'ensemble des cas, pas seulement sur les gagnants."]}, "Effet de sous-additivité": {"ex": [["Santé", "On estime moins probable de mourir « de maladie » que la somme des risques de mourir d'un cancer, d'une crise cardiaque ou d'une autre maladie."], ["Assurance", "Des gens sont prêts à payer plus cher une assurance qui liste des risques précis qu'une assurance « tous risques »."], ["Travail", "Un projet paraît plus risqué quand on détaille chaque problème possible que quand on parle de « retards » en général."]], "why": "Quand un événement est découpé en détails, chaque détail devient plus facile à imaginer, et paraît donc plus probable. L'ensemble décrit en un mot paraît moins vivant.", "tips": ["Vérifier que la probabilité du tout n'est pas inférieure à la somme de ses parties.", "Comparer des options décrites avec le même niveau de détail."]}, "Effet de dénomination": {"ex": [["Consommation", "On garde plus longtemps un billet de 50 € que la même somme en pièces de 2 €."], ["Finance", "Pour limiter ses dépenses, certaines personnes retirent de gros billets."], ["Voyage", "À l'étranger, on dépense plus vite la monnaie en petites coupures."]], "why": "Casser un gros billet donne l'impression d'« entamer » une somme, ce qui freine la dépense. Les petites coupures semblent déjà « dépensables ».", "tips": ["Utiliser cet effet à son avantage : retirer de gros billets pour moins dépenser.", "Suivre ses dépenses en montant total, pas en nombre de pièces ou de billets."]}, "Nombre magique 7 ± 2": {"ex": [["Vie quotidienne", "Les numéros de téléphone sont découpés en paires de chiffres pour être plus faciles à retenir."], ["Interface", "Un menu de 20 options sans regroupement est difficile à mémoriser."], ["Éducation", "Un cours qui présente trop d'idées nouvelles à la fois est mal retenu."]], "why": "La mémoire à court terme a une capacité limitée : George Miller l'estimait à environ sept éléments, et des travaux plus récents la situent plutôt autour de quatre « blocs ». Regrouper les informations en blocs permet d'en retenir davantage.", "tips": ["Regrouper les informations en blocs (chiffres par paires, idées par thèmes).", "Ne pas présenter trop d'éléments nouveaux en même temps."]}, "Illusion de transparence": {"ex": [["Éducation", "Avant un oral, on est persuadé que le jury voit notre trac, alors qu'il ne remarque rien."], ["Relations", "On croit que notre partenaire sait qu'on est contrarié, alors qu'on ne l'a pas dit."], ["Travail", "Un manager pense que ses attentes sont évidentes, alors qu'il ne les a jamais expliquées."]], "why": "On vit nos émotions de l'intérieur, intensément, et on suppose qu'elles se voient autant de l'extérieur. En réalité, les autres perçoivent beaucoup moins nos états intérieurs.", "tips": ["Dire clairement ce qu'on ressent ou ce qu'on attend, plutôt que de supposer que c'est visible.", "Avant de parler en public, se rappeler que le stress se voit bien moins qu'on ne le croit."]}, "Malédiction de la connaissance": {"ex": [["Éducation", "Un professeur expert oublie les difficultés d'un débutant et va trop vite."], ["Travail", "Une notice technique écrite par des ingénieurs est incompréhensible pour les utilisateurs."], ["Science", "Dans une expérience, des personnes qui tapotent le rythme d'une chanson connue sont sûres que les autres la reconnaîtront ; presque personne n'y arrive."]], "why": "Une fois qu'on sait quelque chose, on ne peut plus « désapprendre » pour se mettre à la place de quelqu'un qui ne le sait pas. Notre savoir colore tout ce qu'on perçoit.", "tips": ["Tester ses explications auprès d'une personne qui ne connaît pas le sujet.", "Partir d'exemples concrets avant le jargon."]}, "Effet de projecteur": {"ex": [["Vie quotidienne", "On croit que tout le monde a remarqué la tache sur notre chemise."], ["Science", "Des étudiants obligés de porter un t-shirt embarrassant surestiment fortement le nombre de personnes qui l'ont remarqué."], ["Éducation", "Après une erreur en classe, un élève pense que tout le monde s'en souviendra."]], "why": "On est le centre de notre propre expérience, et on a du mal à se rendre compte qu'on n'est pas le centre de celle des autres, qui sont occupés par eux-mêmes.", "tips": ["Se rappeler que les autres pensent surtout à eux-mêmes.", "Se demander si l'on a soi-même remarqué ce genre de détail chez les autres."]}, "Biais des incitations extrinsèques": {"ex": [["Travail", "« Mes collègues travaillent pour le salaire ; moi, c'est parce que le métier me passionne. »"], ["Management", "Un manager mise uniquement sur les primes, en sous-estimant le besoin de sens de son équipe."], ["Société", "On suppose que les bénévoles cherchent surtout à embellir leur CV."]], "why": "On connaît ses propres motivations profondes de l'intérieur, mais on ne voit chez les autres que les récompenses visibles. On leur prête donc des motivations plus superficielles.", "tips": ["Demander aux gens ce qui les motive plutôt que de le supposer.", "Penser à l'autonomie, au sens et à la reconnaissance, pas seulement à l'argent."]}, "Illusion d'agence externe": {"ex": [["Relations", "Après un rendez-vous arrangé qui se passe bien, on crédite l'ami organisateur d'une intuition remarquable."], ["Croyances", "On attribue un changement positif dans sa vie à un « signe » ou au destin."], ["Santé", "On attribue son bien-être retrouvé à un thérapeute, alors qu'on s'est surtout adapté soi-même."]], "why": "Notre esprit a des mécanismes discrets qui nous aident à nous adapter (un « système immunitaire psychologique »). Comme on ne les voit pas agir, on attribue l'amélioration à quelqu'un ou à quelque chose d'extérieur.", "tips": ["Reconnaître sa propre capacité d'adaptation.", "Se demander si le changement aurait eu lieu sans cette intervention extérieure."]}, "Illusion de connaissance asymétrique": {"ex": [["Relations", "« Je l'ai compris en cinq minutes ; lui ne sait vraiment rien de moi. »"], ["Politique", "On pense bien comprendre les motivations du camp adverse, mais être mal compris par lui."], ["Travail", "On croit cerner un collègue après une réunion, tout en se sentant incompris de lui."]], "why": "On juge les autres sur leurs comportements visibles, qu'on trouve révélateurs, mais on se juge soi-même sur ses pensées intérieures, qu'on trouve bien plus riches que ce qu'on montre.", "tips": ["Se rappeler que les autres ont, eux aussi, une vie intérieure qu'on ne voit pas.", "Poser des questions avant de conclure qu'on a compris quelqu'un."]}, "Effet de télescopage": {"ex": [["Santé", "On est sûr d'être allé chez le dentiste il y a six mois ; c'était il y a plus d'un an."], ["Sondages", "Dans les enquêtes, les gens situent trop récemment des événements anciens, ce qui gonfle les chiffres."], ["Histoire", "Un événement marquant d'il y a dix ans semble dater d'hier."]], "why": "Un souvenir vif et clair paraît récent, parce qu'on utilise la netteté d'un souvenir comme indice de sa date. Les souvenirs importants restent nets plus longtemps.", "tips": ["Dater ses souvenirs à l'aide de repères (agenda, photos, événements connus).", "Noter les dates des rendez-vous ou événements importants."]}, "Rétrospective de la vie en rose": {"ex": [["Voyage", "On se souvient de ses vacances comme parfaites, en oubliant la pluie et les disputes."], ["Société", "« C'était mieux avant » : on idéalise l'époque de sa jeunesse."], ["Travail", "On regrette un ancien emploi qu'on trouvait pourtant pénible."]], "why": "Avec le temps, les émotions négatives des souvenirs s'atténuent plus vite que les positives. On garde surtout l'essentiel et les beaux moments.", "tips": ["Relire des traces de l'époque (messages, journaux) pour retrouver le souvenir réel.", "Se méfier de la nostalgie dans les décisions (revenir en arrière, refaire la même chose)."]}, "Biais de résultat": {"ex": [["Transport", "Un conducteur rentre sans encombre après avoir bu : on juge sa décision moins grave que s'il avait eu un accident."], ["Santé", "Un médecin est jugé incompétent après une complication, même si sa décision était la bonne au vu des informations disponibles."], ["Finance", "On félicite un investisseur chanceux comme s'il avait été prudent."]], "why": "Le résultat est visible et marquant, alors que la qualité d'une décision dépend des informations disponibles au moment de la prendre. On juge donc la décision à ce qui s'est passé ensuite.", "tips": ["Évaluer une décision avec les informations qu'on avait au moment de la prendre.", "Distinguer une bonne décision d'un bon résultat, et une mauvaise décision d'un mauvais sort."]}, "Chance morale": {"ex": [["Transport", "Deux conducteurs grillent le même feu rouge ; seul celui qui renverse un piéton est jugé coupable."], ["Justice", "Une tentative de meurtre est moins punie qu'un meurtre, alors que l'intention est la même."], ["Santé", "Une erreur médicale sans conséquence est vite oubliée ; la même erreur avec un décès mène à un procès."]], "why": "On juge les gens à la fois sur leurs intentions et sur les conséquences de leurs actes, même quand ces conséquences relèvent du hasard.", "tips": ["Séparer ce que la personne a choisi de ce qui est arrivé par hasard.", "Se demander si l'on jugerait la même action de la même façon avec une autre issue."]}, "Déclinisme": {"ex": [["Société", "« Les jeunes ne lisent plus et le pays va de mal en pis. »"], ["Politique", "Des discours présentent chaque génération comme moins vertueuse que la précédente."], ["Éducation", "On pense que le niveau scolaire baisse depuis des décennies, sans regarder les données disponibles."]], "why": "La mémoire adoucit le passé, et les mauvaises nouvelles du présent sont plus visibles. La comparaison entre un passé embelli et un présent noirci donne une impression de déclin.", "tips": ["Comparer des données réelles sur longue période (santé, pauvreté, éducation).", "Se rappeler que la même plainte existe à toutes les époques."]}, "Biais d'impact": {"ex": [["Relations", "On pense qu'une rupture nous rendra malheureux pendant des années ; quelques mois plus tard, on va bien."], ["Consommation", "On imagine qu'une nouvelle voiture nous rendra durablement heureux, puis on s'y habitue."], ["Travail", "On redoute un échec professionnel comme une catastrophe, puis on rebondit plus vite que prévu."]], "why": "Quand on imagine un événement futur, on se concentre sur lui et on oublie tout le reste de la vie qui continuera. On sous-estime aussi notre capacité à nous adapter.", "tips": ["Se rappeler comment on s'est remis d'événements semblables par le passé.", "Penser à tout ce qui restera inchangé dans sa vie après l'événement."]}, "Biais de pessimisme": {"ex": [["Éducation", "Avant un examen, on est persuadé d'échouer malgré une bonne préparation."], ["Santé", "Une personne anxieuse surestime ses risques de tomber gravement malade."], ["Société", "On croit la criminalité en hausse alors que les chiffres montrent l'inverse."]], "why": "L'anxiété et l'humeur dépressive orientent l'attention vers les menaces. Le cerveau imagine plus facilement les scénarios négatifs et leur accorde trop de probabilité.", "tips": ["Comparer ses prévisions passées avec ce qui s'est réellement passé.", "Chercher les statistiques réelles avant d'estimer un risque."]}, "Biais de planification": {"ex": [["Travail", "Le chantier prévu pour trois semaines dure trois mois."], ["Éducation", "Un étudiant pense finir son mémoire en un week-end et y passe un mois."], ["Politique", "Les grands projets publics (Jeux olympiques, opéras, lignes de train) dépassent souvent leur budget et leurs délais."]], "why": "On imagine le scénario idéal de notre projet, étape par étape, en oubliant les imprévus. On néglige aussi l'expérience des projets semblables qui ont pris du retard.", "tips": ["Regarder combien de temps ont pris des projets similaires dans le passé.", "Ajouter une marge pour les imprévus, puis vérifier si elle suffit."]}, "Biais du gain de temps": {"ex": [["Transport", "On accélère sur l'autoroute de 110 à 130 km/h en surestimant le temps gagné."], ["Transport", "En ville, on sous-estime le temps gagné en passant de 30 à 50 km/h."], ["Travail", "On pense gagner beaucoup en accélérant une tâche déjà rapide, et pas assez en accélérant une tâche lente."]], "why": "Le temps de trajet ne diminue pas proportionnellement à la vitesse : chaque km/h de plus fait gagner de moins en moins de temps. Notre intuition raisonne de façon linéaire.", "tips": ["Calculer le temps réellement gagné avant de prendre un risque pour aller plus vite.", "Se rappeler qu'accélérer à vitesse déjà élevée fait gagner peu de temps."]}, "Biais pro-innovation": {"ex": [["Éducation", "Équiper chaque élève d'une tablette sans vérifier que cela améliore les apprentissages."], ["Santé", "Adopter un nouveau traitement plus cher sans preuve qu'il est meilleur que l'ancien."], ["Travail", "Changer de logiciel à chaque nouvelle tendance, au prix de longues formations."]], "why": "La nouveauté est associée au progrès, et ceux qui défendent une innovation se concentrent sur ses avantages. Ses limites et ses effets secondaires sont moins visibles au départ.", "tips": ["Demander des preuves concrètes des bénéfices avant d'adopter une innovation.", "Tester à petite échelle avant de généraliser."]}, "Biais de projection": {"ex": [["Consommation", "On fait ses courses en ayant faim, comme si on aurait le même appétit toute la semaine."], ["Santé", "Une personne en bonne santé rédige des directives médicales sans imaginer ce qu'elle voudrait une fois malade."], ["Consommation", "On s'abonne à une salle de sport en janvier, motivé, en pensant l'être toute l'année."]], "why": "Il est difficile d'imaginer qu'on aura d'autres envies plus tard. Le cerveau prend son état présent comme modèle de l'avenir.", "tips": ["Avant un engagement long, se demander : « Et si je n'avais plus envie dans trois mois ? »", "Éviter les décisions importantes sous le coup d'une émotion forte."]}, "Biais de retenue": {"ex": [["Santé", "On garde des chips à la maison en se disant qu'on n'en mangera qu'un peu."], ["Santé", "Des fumeurs pensent pouvoir s'arrêter quand ils veulent et sous-estiment la dépendance."], ["Numérique", "On installe un jeu en se promettant de n'y jouer que dix minutes par jour."]], "why": "On surestime sa maîtrise de soi parce qu'on l'évalue à froid, quand la tentation est absente. Cette confiance pousse à s'exposer davantage aux tentations.", "tips": ["Réduire l'exposition aux tentations plutôt que de compter sur sa volonté.", "Se fixer des règles simples à l'avance, quand on est « à froid »."]}, "Biais de cohérence avec soi": {"ex": [["Politique", "Un électeur qui a changé de parti affirme avoir toujours pensé comme aujourd'hui."], ["Relations", "Un couple qui va mal se souvient de ses débuts comme moins heureux qu'ils ne l'étaient."], ["Santé", "Après avoir changé d'habitudes, on croit qu'on a toujours été attentif à sa santé."]], "why": "La mémoire reconstruit le passé à partir de nos opinions actuelles. Se croire cohérent dans le temps renforce une identité stable et rassurante.", "tips": ["Garder des traces écrites de ses opinions et décisions passées.", "Accepter d'avoir changé d'avis : c'est souvent un signe d'apprentissage."]}, "Biais d'excès de confiance": {"ex": [["Finance", "Des investisseurs particuliers sûrs de leur jugement achètent et vendent trop souvent, ce qui réduit leurs gains."], ["Santé", "Des médecins très sûrs de leur diagnostic se trompent plus souvent qu'ils ne le pensent."], ["Travail", "Un chef de projet certain de tenir les délais ne prévoit aucune marge."]], "why": "La confiance repose sur le sentiment de comprendre une situation, pas sur la précision réelle de nos jugements. On voit ce qu'on sait, mais pas ce qu'on ignore.", "tips": ["Noter ses prévisions avec un niveau de certitude, puis vérifier combien étaient justes.", "Se demander : « Qu'est-ce qui pourrait faire que je me trompe ? »"]}, "Désirabilité sociale": {"ex": [["Sondages", "Les gens déclarent lire et faire du sport bien plus qu'ils ne le font réellement."], ["Santé", "Des patients minimisent leur consommation d'alcool face à leur médecin."], ["Politique", "Certains électeurs n'avouent pas leur vrai vote dans les sondages."]], "why": "On veut être bien vu, même par un inconnu ou un questionnaire anonyme. On ajuste donc ses réponses vers ce qui semble socialement acceptable.", "tips": ["Pour une enquête, garantir l'anonymat et poser des questions neutres.", "Croiser les déclarations avec des comportements observés."]}, "Effet « troisième personne »": {"ex": [["Publicité", "« La publicité, ça marche sur les autres, pas sur moi. »"], ["Médias", "On pense que les fausses informations trompent les autres, mais qu'on saurait les repérer."], ["Politique", "On soutient la censure de certains contenus en pensant qu'ils influencent les autres, pas soi."]], "why": "On se voit comme plus lucide et moins influençable que la moyenne. Reconnaître qu'on est influencé menacerait cette image positive de soi.", "tips": ["Partir du principe qu'on est aussi influençable que les autres.", "Repérer les messages qui ont modifié nos choix récents."]}, "Effet de faux consensus": {"ex": [["Travail", "« Tout le monde trouve cette réunion inutile. »"], ["Politique", "Des militants surestiment le nombre de personnes qui partagent leurs opinions."], ["Science", "Dans une expérience, des étudiants qui acceptent de porter un panneau ridicule pensent que la majorité accepterait aussi ; ceux qui refusent pensent l'inverse."]], "why": "On fréquente surtout des gens qui nous ressemblent, et nos opinions nous paraissent naturelles et évidentes. On en déduit qu'elles sont largement partagées.", "tips": ["Chercher des données (sondages, études) plutôt que de se fier à son entourage.", "Demander l'avis de personnes qui ne nous ressemblent pas."]}, "Effet difficile-facile": {"ex": [["Éducation", "Un élève est trop sûr de lui sur un exercice très difficile, mais doute sur un exercice facile."], ["Jeux", "Dans un quiz, on surestime ses bonnes réponses aux questions pointues."], ["Travail", "On sous-estime sa capacité à réussir une tâche simple qu'on fait rarement."]], "why": "Notre sentiment de confiance varie moins que la difficulté réelle des tâches. Il ne s'ajuste pas assez : il reste trop haut quand c'est difficile et trop bas quand c'est facile.", "tips": ["Comparer sa confiance avec ses résultats réels sur des tâches de difficultés différentes.", "Sur les questions difficiles, prévoir une vérification supplémentaire."]}, "Effet Lac Wobegon": {"ex": [["Transport", "Une grande majorité de conducteurs s'estiment meilleurs que la moyenne."], ["Éducation", "La plupart des enseignants se jugent au-dessus de la moyenne de leurs collègues."], ["Santé", "Beaucoup de gens pensent manger plus sainement que la moyenne."]], "why": "On se compare à une moyenne floue, en s'appuyant sur ses intentions et ses points forts. Se voir au-dessus de la moyenne protège l'estime de soi.", "tips": ["Se comparer à des données concrètes, pas à une moyenne imaginée.", "Demander des retours extérieurs sur ses compétences."]}, "Effet Dunning-Kruger": {"ex": [["Santé", "Après quelques vidéos, on se sent capable de contredire un médecin."], ["Travail", "Un débutant surestime son niveau, alors qu'un expert doute davantage de lui."], ["Débat", "Les personnes qui connaissent le moins un sujet sont parfois les plus catégoriques."]], "why": "Pour évaluer sa compétence, il faut justement les compétences qui manquent. Les débutants ne voient pas leurs erreurs, alors que les experts voient la complexité du sujet. Des travaux récents suggèrent qu'une partie de l'effet tient aussi à des artefacts statistiques.", "tips": ["Demander des retours concrets à des personnes plus expérimentées.", "Se demander : « Qu'est-ce que je ne sais pas sur ce sujet ? »"]}, "Biais égocentrique": {"ex": [["Relations", "Dans un couple, chacun estime faire plus de la moitié des tâches ménagères."], ["Travail", "Chaque membre d'une équipe pense avoir fait la plus grosse partie du projet."], ["Science", "Des co-auteurs, interrogés séparément, s'attribuent au total bien plus de 100 % du travail."]], "why": "On se souvient mieux de ce qu'on a fait soi-même, parce qu'on l'a vécu de l'intérieur. Les contributions des autres, moins visibles, sont sous-estimées.", "tips": ["Lister concrètement ce que chacun a fait avant de juger la répartition.", "Demander aux autres comment ils voient leur propre contribution."]}, "Biais d'optimisme": {"ex": [["Santé", "« Les accidents et les maladies, ça n'arrive qu'aux autres. »"], ["Relations", "Les jeunes mariés estiment leur risque de divorce bien inférieur à la moyenne."], ["Travail", "Les créateurs d'entreprise surestiment largement leurs chances de succès."]], "why": "Croire que l'avenir sera favorable protège le moral et encourage l'action. Le cerveau intègre plus facilement les bonnes nouvelles que les mauvaises quand il met à jour ses croyances.", "tips": ["Partir des statistiques générales (« sur 100 personnes comme moi… »).", "Prévoir un plan B, même quand on est confiant."]}, "Effet Forer": {"ex": [["Science", "En 1948, les étudiants de Bertram Forer notent environ 4,3 sur 5 un portrait « personnalisé », identique pour toute la classe."], ["Croyances", "Les horoscopes et les lectures de voyance paraissent justes parce qu'ils restent vagues."], ["Travail", "Certains tests de personnalité séduisent par des descriptions qui conviennent à presque tout le monde."]], "why": "Une description vague et flatteuse laisse chacun y projeter sa propre histoire. On retient ce qui correspond et on oublie ce qui ne correspond pas.", "tips": ["Se demander si la description s'appliquerait à la plupart des gens.", "Préférer les outils validés scientifiquement aux tests séduisants."]}, "Effet Barnum": {"ex": [["Croyances", "« Vous avez besoin d'être apprécié, mais vous êtes parfois critique envers vous-même » : tout le monde s'y reconnaît."], ["Numérique", "Les quiz « Quel personnage êtes-vous ? » donnent des profils qui conviennent à tous."], ["Croyances", "La graphologie ou la numérologie paraissent justes grâce à des formules générales."]], "why": "C'est l'autre nom de l'effet Forer : des affirmations générales, souvent positives, semblent écrites pour nous parce qu'on y projette nos expériences personnelles.", "tips": ["Échanger son « profil » avec celui d'une autre personne : se reconnaît-on encore ?", "Demander quelles prédictions précises et vérifiables l'outil fait."]}, "Biais d'autocomplaisance": {"ex": [["Éducation", "« J'ai réussi parce que j'ai travaillé ; j'ai raté parce que le sujet était injuste. »"], ["Travail", "Un dirigeant attribue les bons résultats à sa stratégie et les mauvais à la conjoncture."], ["Sport", "Après une victoire, l'équipe parle de son talent ; après une défaite, de l'arbitre."]], "why": "Attribuer ses succès à soi et ses échecs aux circonstances protège l'estime de soi et la motivation.", "tips": ["Après un succès, chercher aussi la part de chance ; après un échec, la part de responsabilité.", "Analyser ses échecs avec quelqu'un de neutre."]}, "Effet acteur-observateur": {"ex": [["Vie quotidienne", "« Je suis en retard à cause des bouchons ; lui est en retard parce qu'il est désorganisé. »"], ["Relations", "On explique sa propre colère par la situation, celle de l'autre par son mauvais caractère."], ["Travail", "Un salarié explique ses erreurs par la surcharge, mais celles de ses collègues par leur manque de compétence."]], "why": "Quand on agit, on voit la situation autour de nous. Quand on observe quelqu'un, c'est la personne qui est au centre de notre attention. On explique donc ses propres actes par le contexte et ceux des autres par leur caractère.", "tips": ["Chercher les circonstances qui pourraient expliquer le comportement d'autrui.", "Se demander : « Qu'est-ce que j'aurais fait à sa place ? »"]}, "Illusion de contrôle": {"ex": [["Jeux", "Au loto, on préfère choisir ses numéros soi-même, comme si cela augmentait ses chances."], ["Jeux", "Au craps, des joueurs lancent les dés plus fort quand ils veulent un grand nombre."], ["Finance", "Un trader pense maîtriser des marchés qui relèvent en grande partie du hasard."]], "why": "Se sentir maître de la situation est rassurant et motivant. Le cerveau confond facilement le fait d'agir avec le fait d'avoir une influence sur le résultat.", "tips": ["Distinguer ce qui dépend de nos actions de ce qui relève du hasard.", "Vérifier si nos résultats auraient été différents sans notre intervention."]}, "Supériorité illusoire": {"ex": [["Éducation", "La majorité des étudiants s'estiment plus intelligents que la moyenne de leur promotion."], ["Travail", "La plupart des salariés pensent être plus productifs que leurs collègues."], ["Relations", "On se croit plus objectif et plus juste que la moyenne des gens."]], "why": "On se juge sur ses intentions et ses meilleurs moments, et on retient surtout ses réussites. Se voir au-dessus de la moyenne nourrit l'estime de soi.", "tips": ["Se comparer à des mesures objectives (résultats, évaluations).", "Demander des retours honnêtes à des personnes de confiance."]}, "Erreur fondamentale d'attribution": {"ex": [["Transport", "Le conducteur qui nous coupe la route est « un idiot », pas quelqu'un en retard pour l'hôpital."], ["Science", "Des participants jugent qu'un auteur pense vraiment ce qu'il écrit, même en sachant qu'on lui a imposé sa position."], ["Travail", "Un manager attribue la baisse de résultats d'un employé à sa paresse, sans voir ses difficultés personnelles."]], "why": "La personne est ce qu'on voit, la situation est souvent invisible. Il est plus simple d'expliquer un comportement par la personnalité que d'enquêter sur le contexte.", "tips": ["Avant de juger, imaginer au moins deux explications liées à la situation.", "Poser des questions sur le contexte."]}, "Hypothèse d'attribution défensive": {"ex": [["Transport", "Face à un accident de voiture, un conducteur prudent rejette la faute sur la victime : « ça ne m'arriverait pas »."], ["Santé", "On blâme une personne malade pour son mode de vie, pour se rassurer sur sa propre santé."], ["Justice", "Des jurés qui ressemblent à l'accusé lui attribuent moins de responsabilité."]], "why": "Voir qu'un malheur peut nous arriver fait peur. Attribuer la faute à la victime (si elle est différente de nous) ou au hasard (si elle nous ressemble) nous protège de cette angoisse.", "tips": ["Se demander si l'on juge pour comprendre ou pour se rassurer.", "Reconnaître que les malheurs peuvent toucher n'importe qui."]}, "Biais d'attribution des traits": {"ex": [["Travail", "« Moi, je m'adapte selon les gens ; mon collègue, lui, est toujours le même. »"], ["Relations", "On se décrit comme « ça dépend », mais on colle des étiquettes fixes aux autres."], ["Éducation", "Un élève se voit comme changeant, mais pense que le professeur a un caractère figé."]], "why": "On connaît la variété de nos propres comportements selon les situations, mais on ne voit les autres que dans quelques contextes. Ils nous paraissent donc plus constants.", "tips": ["Observer les autres dans plusieurs situations avant de les étiqueter.", "Éviter les formulations « il est toujours comme ça »."]}, "Justification de l'effort": {"ex": [["Société", "Après un bizutage pénible, les nouveaux membres valorisent davantage leur association."], ["Éducation", "On trouve une formation géniale parce qu'elle a été difficile à obtenir."], ["Travail", "Après des heures de travail sur un projet, on refuse de voir ses défauts."]], "why": "Avoir fait beaucoup d'efforts pour un résultat décevant crée un inconfort (une dissonance). On le réduit en donnant plus de valeur au résultat.", "tips": ["Évaluer un résultat indépendamment de l'effort qu'il a coûté.", "Demander l'avis de quelqu'un qui n'a pas participé."]}, "Compensation du risque": {"ex": [["Transport", "Avec des freins ABS, certains conducteurs freinent plus tard et suivent de plus près."], ["Sport", "Des skieurs casqués prennent parfois plus de risques."], ["Santé", "Après un vaccin, certaines personnes relâchent les autres gestes de prévention."]], "why": "On ajuste son comportement au niveau de risque qu'on perçoit : se sentir mieux protégé pousse à être moins prudent. L'effet existe mais reste généralement inférieur au bénéfice des protections.", "tips": ["Garder les mêmes précautions après avoir ajouté une protection.", "Se rappeler que la protection réduit le risque, elle ne le supprime pas."]}, "Effet Peltzman": {"ex": [["Transport", "L'économiste Sam Peltzman a avancé que les ceintures de sécurité poussaient certains conducteurs à rouler plus vite."], ["Sport", "Des cyclistes équipés de protections roulent parfois plus vite."], ["Finance", "Une banque qui se sent protégée par l'État prend plus de risques."]], "why": "C'est une forme de compensation du risque : une mesure de sécurité modifie les comportements, ce qui réduit une partie de son effet. L'ampleur réelle de cet effet reste débattue.", "tips": ["Accompagner les mesures de sécurité d'informations sur les risques restants.", "Évaluer les mesures de sécurité sur leurs effets réels, pas seulement théoriques."]}, "Rabais hyperbolique": {"ex": [["Finance", "On repousse l'épargne pour s'offrir quelque chose aujourd'hui."], ["Santé", "On préfère le plaisir immédiat d'une cigarette aux bénéfices lointains d'arrêter."], ["Éducation", "On procrastine les révisions en faveur d'une sortie, même si l'examen compte beaucoup."]], "why": "Le cerveau accorde beaucoup plus de valeur au présent qu'au futur, et cette préférence est particulièrement forte pour l'immédiat. Les récompenses lointaines semblent abstraites.", "tips": ["Automatiser les bons choix (virement d'épargne automatique).", "Rendre le bénéfice futur concret : l'imaginer, le chiffrer, le rapprocher."]}, "Appel à la nouveauté": {"ex": [["Travail", "« Cette méthode de management date de cette année, elle est forcément meilleure. »"], ["Consommation", "On remplace son téléphone dès qu'un nouveau modèle sort, même si l'ancien suffit."], ["Santé", "Un nouveau régime à la mode paraît plus efficace que des conseils éprouvés."]], "why": "La nouveauté attire l'attention et est associée au progrès. Elle donne aussi l'impression d'être à la pointe.", "tips": ["Demander des preuves que la nouveauté fait mieux que l'existant.", "Se demander ce que l'ancienne solution avait de bon."]}, "Effet de la victime identifiable": {"ex": [["Société", "La photo d'un seul enfant en détresse rapporte plus de dons que les statistiques de millions d'enfants touchés."], ["Médias", "Un sauvetage individuel mobilise des moyens énormes, alors que des risques collectifs plus graves restent ignorés."], ["Santé", "Une campagne sur une personne précise touche plus qu'un chiffre sur une maladie."]], "why": "Une personne identifiable provoque de l'empathie et des émotions fortes. Les grands nombres restent abstraits et ne déclenchent pas les mêmes émotions.", "tips": ["Pour donner ou décider, regarder aussi l'efficacité et le nombre de personnes aidées.", "Se rappeler que derrière chaque chiffre, il y a des personnes réelles."]}, "Biais des coûts irrécupérables": {"ex": [["Vie quotidienne", "On finit un film ennuyeux parce que la place a été payée."], ["Travail", "On continue un projet qui n'a plus d'avenir parce qu'on y a déjà investi beaucoup."], ["Relations", "On reste dans une relation malheureuse « après tout ce qu'on a vécu »."]], "why": "Abandonner donne l'impression de reconnaître une perte et un gaspillage. Or ce qui est dépensé est perdu dans tous les cas : seule compte la suite.", "tips": ["Se demander : « Si je partais de zéro aujourd'hui, est-ce que je choisirais ça ? »", "Fixer à l'avance des critères d'arrêt pour un projet."]}, "Escalade irrationnelle": {"ex": [["Jeux", "Lors d'une enchère, on dépasse largement son budget pour ne pas « perdre » ce qu'on a déjà misé."], ["Science", "Dans l'enchère d'un billet de 20 €, les participants finissent par payer plus que la valeur du billet."], ["Politique", "Un gouvernement poursuit un conflit coûteux pour ne pas reconnaître l'échec."]], "why": "Une fois engagé, abandonner reviendrait à admettre une erreur. La compétition et l'amour-propre poussent à aller encore plus loin.", "tips": ["Fixer une limite avant de commencer, et s'y tenir.", "Se demander ce qu'on gagne vraiment à continuer, en oubliant ce qui est déjà dépensé."]}, "Escalade d'engagement": {"ex": [["Travail", "Le Concorde a continué d'être financé alors que sa non-rentabilité était connue."], ["Finance", "Un investisseur rachète des actions en chute pour « faire baisser son prix moyen »."], ["Politique", "Un grand chantier public continue malgré l'explosion de son budget."]], "why": "Plus on a investi de temps, d'argent ou de réputation, plus il est difficile d'admettre l'échec. On cherche à justifier les décisions passées en continuant.", "tips": ["Faire évaluer la suite du projet par quelqu'un qui n'a pas pris les décisions de départ.", "Prévoir des points de contrôle avec la possibilité d'arrêter."]}, "Effet de génération d'information": {"ex": [["Éducation", "On retient mieux « chaud – fr__d » complété soi-même que la paire « chaud – froid » lue toute faite."], ["Éducation", "Reformuler un cours avec ses propres mots aide à le mémoriser."], ["Travail", "On retient mieux une solution qu'on a trouvée qu'une solution qu'on nous a donnée."]], "why": "Produire une information demande un effort de recherche en mémoire et d'organisation, ce qui crée des traces plus solides que la simple lecture.", "tips": ["Cacher les réponses et essayer de les retrouver avant de les relire.", "Faire des fiches avec ses propres mots plutôt que recopier."]}, "Aversion à la perte": {"ex": [["Finance", "On refuse un pari à 50/50 où l'on gagne 120 € ou perd 100 €."], ["Consommation", "« Plus que 3 jours pour en profiter » pousse à acheter par peur de manquer l'occasion."], ["Travail", "Les salariés réagissent plus fortement à une baisse de prime qu'à une hausse équivalente."]], "why": "Selon les travaux de Kahneman et Tversky, perdre fait environ deux fois plus mal que gagner la même chose ne fait plaisir. Éviter les pertes a longtemps été une question de survie.", "tips": ["Évaluer une décision en termes de résultat final, pas de gain ou de perte par rapport à aujourd'hui.", "Se demander si la peur de perdre fait passer à côté d'une bonne occasion."]}, "Effet IKEA": {"ex": [["Consommation", "L'étagère montée de ses mains paraît plus belle que celle du magasin."], ["Travail", "Une équipe surestime la valeur d'un outil qu'elle a développé elle-même."], ["Cuisine", "Un plat qu'on a cuisiné soi-même paraît meilleur que le même plat acheté tout prêt."]], "why": "L'effort fourni donne un sentiment de compétence et d'appropriation. On valorise ce qu'on a fait parce que cela nous représente un peu.", "tips": ["Demander un avis extérieur sur ce qu'on a créé.", "Comparer avec des alternatives existantes avant de défendre sa création."]}, "Biais de la portion": {"ex": [["Santé", "On mange plus de pop-corn quand le paquet est plus grand, même sans avoir plus faim."], ["Consommation", "On finit son assiette au restaurant, quelle que soit la taille de la portion."], ["Santé", "Des cuillères plus grandes font servir plus de nourriture."]], "why": "Une unité (une assiette, un paquet, une part) semble correspondre à « la bonne quantité ». Les signaux extérieurs prennent le dessus sur les sensations de faim.", "tips": ["Utiliser des assiettes et des contenants plus petits.", "Servir une portion, puis ranger le reste."]}, "Biais du risque zéro": {"ex": [["Santé", "On préfère supprimer totalement un risque très faible plutôt que diviser par deux un risque bien plus élevé."], ["Politique", "Des réglementations visent à éliminer un risque minime à grand coût, au détriment de risques plus importants."], ["Consommation", "On paie cher une option « zéro risque » plutôt qu'une protection plus efficace sur l'ensemble."]], "why": "Le « zéro » est simple, rassurant et définitif. Réduire un grand risque sans le supprimer laisse une inquiétude, même si le bénéfice total est plus grand.", "tips": ["Comparer le nombre total de problèmes évités par chaque option.", "Se rappeler qu'aucune option n'est jamais vraiment sans risque."]}, "Effet de disposition": {"ex": [["Finance", "Un épargnant vend vite l'action qui a gagné 10 % mais garde celle qui a perdu 30 %, en attendant qu'elle remonte."], ["Logement", "Des propriétaires refusent de vendre en dessous de leur prix d'achat, même si le marché a baissé."], ["Jeux", "Un joueur encaisse ses gains vite mais continue à jouer pour « se refaire »."]], "why": "Vendre un placement gagnant fait plaisir tout de suite, alors que vendre un perdant oblige à reconnaître une perte. On repousse donc ce moment désagréable.", "tips": ["Décider de vendre ou garder selon les perspectives, pas selon le prix d'achat.", "Fixer à l'avance des règles de vente."]}, "Effet de pseudo-certitude": {"ex": [["Jeux", "On choisit l'option « sûre » de la deuxième étape d'un jeu, en oubliant qu'il faut d'abord passer une première étape incertaine."], ["Santé", "Un vaccin qui protège « totalement » contre un virus parmi d'autres paraît plus attirant qu'un vaccin qui réduit de moitié le risque global."], ["Assurance", "On préfère une assurance qui couvre « à 100 % » certains cas à une couverture plus large mais partielle."]], "why": "La certitude a une valeur psychologique particulière. Quand une étape paraît certaine, on oublie que l'ensemble reste incertain.", "tips": ["Calculer la probabilité totale, du début à la fin.", "Se méfier des mots « garanti » ou « 100 % » quand ils ne concernent qu'une partie du problème."]}, "Effet de difficulté de traitement": {"ex": [["Éducation", "Un texte écrit dans une police un peu difficile à lire est mieux retenu qu'un texte très lisible, selon certaines études."], ["Éducation", "S'entraîner avec des exercices variés et un peu difficiles fait mieux retenir que répéter les mêmes."], ["Travail", "On retient mieux un dossier qu'on a dû analyser soi-même qu'un résumé tout fait."]], "why": "Un traitement plus exigeant oblige à prêter attention et à réfléchir davantage, ce qui renforce la mémoire. Les chercheurs parlent de « difficultés désirables », mais certains effets (comme celui des polices) ne se reproduisent pas toujours.", "tips": ["Ne pas chercher uniquement la facilité pour apprendre : s'imposer de petits efforts.", "Varier les exercices et les formats de révision."]}, "Effet de dotation": {"ex": [["Consommation", "Des participants demandent environ deux fois plus pour vendre une tasse qu'on vient de leur offrir que ce qu'ils paieraient pour l'acheter."], ["Logement", "Des vendeurs estiment leur maison plus cher que le prix du marché."], ["Vie quotidienne", "On garde des objets inutiles parce qu'ils nous appartiennent."]], "why": "Ce qu'on possède devient une partie de soi, et s'en séparer est vécu comme une perte. Or les pertes pèsent plus que les gains.", "tips": ["Se demander : « Si je ne l'avais pas, l'achèterais-je à ce prix ? »", "Fixer un prix de vente à partir du marché, pas de son attachement."]}, "Effet boomerang": {"ex": [["Politique", "Face à des chiffres qui contredisent son opinion, un militant s'y accroche encore plus fermement."], ["Santé", "Une campagne de prévention trop alarmiste peut renforcer le comportement qu'elle combat chez certains."], ["Médias", "Corriger une rumeur de façon agressive peut la rendre plus crédible aux yeux de ceux qui y croient."]], "why": "Quand une croyance est liée à notre identité, la contredire est vécu comme une attaque. On la défend alors plus fort. Les études récentes montrent toutefois que cet effet est plus rare qu'on ne le pensait : les corrections fonctionnent le plus souvent.", "tips": ["Présenter les faits de façon respectueuse, sans attaquer l'identité de la personne.", "Proposer une explication alternative plutôt que seulement dire « c'est faux »."]}, "Justification du système": {"ex": [["Travail", "Des salariés mal payés défendent la hiérarchie des salaires de leur entreprise comme juste."], ["Société", "Des personnes défavorisées soutiennent des politiques qui maintiennent les inégalités."], ["Politique", "On défend un système existant simplement parce qu'il est en place depuis longtemps."]], "why": "Croire que le système est juste rassure : il rend le monde prévisible et évite l'inconfort de vivre dans un système injuste qu'on ne peut pas changer.", "tips": ["Évaluer une règle ou une institution sur ses effets, pas sur son ancienneté.", "Se demander qui bénéficie de l'ordre existant."]}, "Psychologie inversée": {"ex": [["Éducation", "« Surtout, ne finis pas tes légumes » dit à un enfant qui refuse de manger."], ["Publicité", "Une marque se présente comme « réservée à quelques-uns » pour attirer tout le monde."], ["Relations", "On dit à quelqu'un qu'il n'osera jamais pour qu'il relève le défi."]], "why": "Elle s'appuie sur la réactance : quand on sent sa liberté menacée, on a tendance à faire l'inverse de ce qu'on nous demande. Elle marche surtout sur les personnes qui résistent aux consignes.", "tips": ["Repérer quand un message semble nous pousser à faire l'inverse de ce qu'il dit.", "Décider en fonction de ce qu'on veut vraiment, pas en réaction à l'interdit."]}, "Réactance": {"ex": [["Culture", "Une étiquette « interdit aux moins de 18 ans » rend un film plus attirant pour les adolescents."], ["Santé", "Des messages de prévention trop autoritaires suscitent un rejet chez une partie du public."], ["Politique", "Une mesure imposée sans explication provoque des réactions de défi."]], "why": "Nous avons besoin de nous sentir libres de nos choix. Quand cette liberté semble menacée, on réagit en voulant la restaurer, parfois en faisant exactement l'inverse.", "tips": ["E
