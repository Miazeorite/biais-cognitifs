xpliquer les raisons d'une règle et laisser des choix possibles.", "Avant de réagir à une interdiction, se demander ce qu'on aurait choisi sans elle."]}, "Effet de dominance asymétrique": {"ex": [["Consommation", "Un café propose un petit à 2 €, un moyen à 3,80 € et un grand à 4 € : le moyen sert surtout à faire choisir le grand."], ["Médias", "Un abonnement papier seul au même prix que papier + numérique rend l'offre combinée irrésistible."], ["Politique", "Un troisième candidat peu attractif peut faire pencher le choix entre les deux autres."]], "why": "On choisit plus facilement par comparaison que dans l'absolu. Une option « leurre » clairement inférieure à l'une des autres rend celle-ci évidente.", "tips": ["Retirer mentalement l'option la moins intéressante et voir si son choix change.", "Se demander si l'on a vraiment besoin de l'option « avantageuse »."]}, "Biais de comparaison sociale": {"ex": [["Travail", "Un recruteur écarte un candidat plus brillant que lui, de peur d'être éclipsé."], ["Science", "Des chercheurs évaluent moins favorablement des collègues très performants dans leur propre domaine."], ["Numérique", "Sur les réseaux sociaux, la réussite des autres provoque de la jalousie plutôt que de l'inspiration."]], "why": "On évalue sa propre valeur en se comparant aux autres. Quelqu'un de meilleur menace cette évaluation, ce qui peut pousser à le rejeter.", "tips": ["Voir les personnes plus compétentes comme une ressource plutôt qu'une menace.", "Recruter et évaluer avec des critères objectifs et plusieurs évaluateurs."]}, "Biais du statu quo": {"ex": [["Consommation", "Garder le même forfait téléphonique, même s'il est devenu plus cher que les autres."], ["Santé", "Dans les pays où le don d'organes est « par défaut », beaucoup plus de gens sont donneurs."], ["Finance", "Des salariés gardent l'option d'épargne retraite par défaut sans jamais la revoir."]], "why": "Changer demande un effort, comporte un risque et peut faire regretter. L'option actuelle sert de point de référence, et tout changement paraît surtout comme une perte possible.", "tips": ["Revoir régulièrement ses abonnements, contrats et choix « par défaut ».", "Se demander : « Si je devais choisir aujourd'hui, choisirais-je cela ? »"]}, "Effet d'ambiguïté": {"ex": [["Finance", "On préfère un placement à rendement connu de 3 % plutôt qu'un placement incertain, même probablement plus rentable."], ["Science", "Dans le paradoxe d'Ellsberg, on préfère tirer dans une urne à composition connue plutôt qu'inconnue."], ["Santé", "Des patients préfèrent un traitement aux effets bien connus à un traitement plus efficace mais moins documenté."]], "why": "Ne pas connaître les probabilités crée un malaise supplémentaire. On préfère un risque connu à un risque inconnu, même si l'inconnu est plus favorable.", "tips": ["Chercher à réduire l'ambiguïté (se renseigner) plutôt que l'éviter.", "Comparer les options sur leurs résultats probables, pas seulement sur ce qu'on en sait."]}, "Biais d'information": {"ex": [["Santé", "Un médecin prescrit un examen supplémentaire alors que le résultat ne changera pas le traitement."], ["Travail", "On retarde une décision en demandant toujours plus de rapports."], ["Consommation", "On lit des dizaines d'avis avant un petit achat, sans que cela change son choix."]], "why": "Chercher de l'information donne l'impression d'être prudent et rigoureux. Mais toute information n'est pas utile : seule compte celle qui peut changer la décision.", "tips": ["Avant de chercher plus d'informations, se demander : « Qu'est-ce que je ferais différemment selon le résultat ? »", "Fixer une date limite pour décider."]}, "Biais de croyance": {"ex": [["Logique", "« Les fleurs ont besoin d'eau ; les roses ont besoin d'eau ; donc les roses sont des fleurs » paraît valide parce que la conclusion est vraie, alors que le raisonnement ne tient pas."], ["Politique", "On trouve convaincants les arguments qui aboutissent à nos opinions, même s'ils sont faibles."], ["Justice", "Des jurés jugent un raisonnement solide parce que sa conclusion leur paraît plausible."]], "why": "Évaluer la logique d'un raisonnement demande un effort ; juger si la conclusion nous paraît vraie est beaucoup plus rapide. Le cerveau prend ce raccourci.", "tips": ["Évaluer le raisonnement indépendamment de la conclusion.", "Tester le même raisonnement avec un contenu différent."]}, "Effet « ça rime donc c'est bon »": {"ex": [["Proverbes", "« Qui se ressemble s'assemble » paraît plus vrai que « les gens qui se ressemblent se fréquentent »."], ["Justice", "« If it doesn't fit, you must acquit » : une formule rimée célèbre de l'avocat d'O. J. Simpson."], ["Publicité", "Les slogans qui riment sont plus facilement crus et retenus."]], "why": "Une phrase qui rime est plus facile à traiter et à retenir. Le cerveau confond cette facilité avec la vérité.", "tips": ["Reformuler l'affirmation sans rime et voir si elle reste convaincante.", "Se méfier des slogans trop bien tournés."]}, "Effet abri à vélo": {"ex": [["Politique", "Un conseil municipal vote un budget de 10 millions en dix minutes et débat une heure du prix des cafés."], ["Travail", "En réunion, on discute longuement de la couleur d'un logo et pas de la stratégie."], ["Numérique", "Dans un projet informatique, des détails faciles provoquent plus de débats que les choix d'architecture."]], "why": "Tout le monde peut avoir un avis sur un sujet simple, ce qui donne envie de participer. Les sujets complexes intimident et sont vite validés par ceux qui ne les maîtrisent pas.", "tips": ["Fixer un temps de discussion proportionnel à l'importance du sujet.", "Traiter les sujets importants en premier dans l'ordre du jour."]}, "Loi de futilité de Parkinson": {"ex": [["Travail", "Une heure de réunion sur la couleur du local à vélos, cinq minutes sur le budget."], ["Politique", "Un comité valide un projet de centrale nucléaire très vite, mais débat longuement de son abri à vélos (exemple imaginé par Parkinson)."], ["Associations", "Une association passe plus de temps sur le choix du goûter que sur sa stratégie annuelle."]], "why": "C. Northcote Parkinson a décrit en 1957 cette tendance : les sujets faciles à comprendre attirent les avis de tous, alors que les sujets complexes sont délégués aux experts sans vraie discussion.", "tips": ["Classer les sujets par enjeu avant la réunion.", "Désigner un responsable qui recadre le débat sur l'essentiel."]}, "Erreur de conjonction": {"ex": [["Science", "Linda, militante engagée, est jugée plus probablement « employée de banque et féministe » que simplement « employée de banque »."], ["Justice", "Un scénario détaillé d'un crime paraît plus probable qu'une version simple, alors qu'il l'est forcément moins."], ["Prévisions", "« Une crise économique causée par une guerre » semble plus probable que « une crise économique »."]], "why": "Les détails rendent une histoire plus cohérente et plus vivante, donc plus crédible. Mais chaque détail ajouté réduit la probabilité que tout soit vrai.", "tips": ["Se rappeler qu'un scénario détaillé est toujours moins probable que le scénario général.", "Se demander : « Est-ce plus probable, ou seulement plus facile à imaginer ? »"]}, "Rasoir d'Ockham": {"ex": [["Vie quotidienne", "« Il a raté son année parce qu'il est paresseux » : une seule cause simple, plutôt que plusieurs causes combinées (santé, famille, méthode)."], ["Santé", "On attribue tous ses symptômes à une seule maladie, alors que plusieurs problèmes peuvent coexister."], ["Science", "Le principe de simplicité est utile en science, mais la réalité n'est pas toujours simple."]], "why": "En science, préférer l'explication la plus simple est un bon principe de méthode. Mais le cerveau peut l'appliquer trop vite et écarter les explications complexes qui sont justes.", "tips": ["Garder l'explication simple comme point de départ, pas comme conclusion définitive.", "Se demander si plusieurs causes ne pourraient pas agir ensemble."]}, "Effet moins-c'est-mieux": {"ex": [["Consommation", "Vu seul, un service de 24 pièces intactes vaut plus à nos yeux qu'un service de 40 pièces dont quelques-unes sont ébréchées, alors qu'il contient moins."], ["Cadeaux", "Un foulard cher à 45 € paraît plus généreux qu'un manteau bon marché à 55 €."], ["Restaurants", "Une petite tasse pleine de glace paraît plus généreuse qu'une grande tasse à moitié vide contenant plus de glace."]], "why": "Quand on évalue une option seule, on s'appuie sur des indices faciles à juger (pleine ou non, intacte ou non) plutôt que sur la quantité réelle, difficile à évaluer sans comparaison.", "tips": ["Comparer les options côte à côte avec des critères chiffrés.", "Se demander ce qu'on obtient vraiment, au-delà de l'impression."]}, "Erreur d'attribution de la source": {"ex": [["Médias", "On cite une information « lue dans un journal sérieux », alors qu'on l'a vue sur un réseau social."], ["Justice", "Un témoin attribue à l'agresseur un visage qu'il a en fait vu ailleurs, par exemple sur une photo de police."], ["Travail", "On croit avoir eu une idée en réunion, alors qu'un collègue l'avait proposée."]], "why": "La mémoire retient bien le contenu d'une information, mais beaucoup moins d'où elle vient. Avec le temps, le lien entre l'information et sa source s'efface.", "tips": ["Noter la source des informations importantes au moment où on les lit.", "Avant de citer une information, vérifier d'où elle vient vraiment."]}, "Confusion de la source": {"ex": [["Vie quotidienne", "On raconte un souvenir d'enfance qu'on a en fait vu sur une photo ou entendu raconter."], ["Justice", "Un témoin mélange ce qu'il a vu avec ce qu'il a lu dans la presse ensuite."], ["Culture", "On ne sait plus si une scène vient d'un film, d'un livre ou de sa propre vie."]], "why": "Les souvenirs ne sont pas rangés avec une étiquette fiable de leur origine. Des informations venant de sources différentes se mélangent et forment un seul souvenir.", "tips": ["Vérifier ses souvenirs importants avec des traces (photos, messages, témoins).", "Se demander : « Est-ce que je m'en souviens, ou est-ce qu'on me l'a raconté ? »"]}, "Cryptomnésie": {"ex": [["Culture", "Un tribunal a jugé que George Harrison avait plagié sans le vouloir, dans « My Sweet Lord », la mélodie d'une chanson entendue des années plus tôt."], ["Éducation", "Un étudiant reproduit une phrase lue dans un livre en croyant l'avoir inventée."], ["Travail", "On propose une « nouvelle » idée qu'on avait en fait entendue dans une réunion passée."]], "why": "Un souvenir peut revenir sans le sentiment d'être un souvenir. Le cerveau le prend alors pour une idée nouvelle.", "tips": ["Vérifier si une idée « originale » n'existe pas déjà (recherche, détecteur de plagiat).", "Noter ses sources au fur et à mesure de ses lectures."]}, "Faux souvenir": {"ex": [["Vie quotidienne", "On est certain d'avoir fermé la porte à clé, alors qu'on ne l'a pas fait."], ["Justice", "Des personnes condamnées sur la base de témoignages sincères mais erronés ont ensuite été innocentées par l'ADN."], ["Science", "Dans des expériences, des participants se « souviennent » de s'être perdus dans un centre commercial enfants, un événement inventé par les chercheurs."]], "why": "La mémoire ne fonctionne pas comme un enregistrement : chaque fois qu'on se souvient, on reconstruit le souvenir. Des éléments imaginés ou suggérés peuvent s'y intégrer.", "tips": ["Ne pas confondre la certitude d'un souvenir avec son exactitude.", "Pour les faits importants, chercher des preuves extérieures."]}, "Suggestibilité": {"ex": [["Justice", "À force de questions orientées, un enfant finit par « se souvenir » d'un événement qui n'a pas eu lieu."], ["Justice", "« Le feu était-il rouge quand la voiture a grillé le feu ? » oriente le souvenir du témoin."], ["Santé", "Certaines pratiques thérapeutiques suggestives ont fait naître de faux souvenirs chez des patients."]], "why": "Quand on nous suggère une information, surtout avec autorité ou de façon répétée, elle peut s'intégrer à nos souvenirs. Le stress et la confiance envers celui qui interroge augmentent cet effet.", "tips": ["Poser des questions ouvertes (« Racontez-moi ») plutôt que des questions qui contiennent la réponse.", "Se méfier des souvenirs apparus après des interrogatoires insistants."]}, "Effet d'espacement": {"ex": [["Éducation", "Réviser 20 minutes par jour pendant une semaine est plus efficace que 2 heures la veille de l'examen."], ["Langues", "Les applications de vocabulaire font revenir les mots à intervalles croissants."], ["Travail", "Une formation répartie sur plusieurs semaines est mieux retenue qu'une journée intensive."]], "why": "Hermann Ebbinghaus l'a décrit dès 1885 : chaque révision après un petit oubli oblige le cerveau à faire l'effort de retrouver l'information, ce qui la consolide.", "tips": ["Répartir ses révisions sur plusieurs jours, avec des intervalles de plus en plus longs.", "Utiliser des cartes ou une application de répétition espacée."]}, "Association implicite": {"ex": [["Science", "Lors d'un test chronométré, on associe plus vite « homme » à « carrière » que « femme » à « carrière »."], ["Publicité", "Une marque associée à des images de nature paraît plus « écologique »."], ["Société", "Des mots comme « danger » viennent spontanément associés à certains groupes à cause des médias."]], "why": "À force d'exposition, le cerveau crée des liens automatiques entre des concepts. Ces associations agissent vite, sans réflexion, et peuvent différer de nos opinions conscientes.", "tips": ["Prendre conscience de ses associations automatiques, sans culpabiliser.", "Ralentir et utiliser des critères explicites pour les décisions importantes."]}, "Stéréotype implicite": {"ex": [["Santé", "Sans s'en rendre compte, on imagine un chirurgien comme un homme."], ["Travail", "Des CV identiques reçoivent moins de réponses quand le nom évoque une origine étrangère."], ["Santé", "Des études montrent que la douleur de certains patients est moins bien prise en charge selon leur origine."]], "why": "Les stéréotypes présents dans la culture s'installent dans la mémoire et influencent nos jugements automatiques, même chez des personnes qui les rejettent consciemment.", "tips": ["Utiliser des procédures standardisées (CV anonymes, grilles d'évaluation).", "Multiplier les contre-exemples : rencontrer, lire, voir des personnes qui contredisent les stéréotypes."]}, "Mémorisation stéréotypée": {"ex": [["Vie quotidienne", "On se souvient qu'un bibliothécaire portait des lunettes, alors qu'il n'en portait pas."], ["Justice", "Un témoin se souvient mieux des détails d'un suspect qui correspondent au stéréotype du criminel."], ["Travail", "On retient les erreurs d'une collègue qui confirment un préjugé, et on oublie ses réussites."]], "why": "Les stéréotypes servent de cadre pour ranger les souvenirs. Ce qui va dans leur sens est mieux retenu, et des détails manquants sont « complétés » par le stéréotype.", "tips": ["Noter les faits précis au moment où on les observe.", "Chercher activement les informations qui contredisent l'image qu'on a d'une personne."]}, "Préjugé": {"ex": [["Logement", "Refuser un logement à quelqu'un à cause de son nom de famille."], ["Travail", "Juger un candidat moins compétent à cause de son accent."], ["Santé", "Prendre moins au sérieux les symptômes d'une personne en surpoids."]], "why": "Le préjugé est un jugement formé avant de connaître la personne, à partir du groupe auquel on la rattache. Il simplifie le monde, mais remplace l'observation par l'a priori.", "tips": ["Se demander : « Sur quoi je fonde ce jugement, concrètement ? »", "Multiplier les contacts réels avec des personnes de groupes différents."]}, "Biais d'affaiblissement de l'affect": {"ex": [["Relations", "On repense à une dispute ancienne avec le sourire, alors que la joie d'un beau souvenir reste intacte."], ["Voyage", "Les galères d'un voyage deviennent des anecdotes drôles, les beaux moments restent émouvants."], ["Santé", "La douleur d'un accouchement est souvent moins vive dans le souvenir que sur le moment."]], "why": "Les émotions négatives liées aux souvenirs s'estompent plus vite que les positives. Ce mécanisme protège le moral et aide à garder une vision positive de sa vie.", "tips": ["Profiter de ce mécanisme, mais garder une trace écrite des expériences à ne pas répéter.", "Avant de refaire une mauvaise expérience, relire ce qu'on en disait sur le moment."]}, "Règle pic-fin": {"ex": [["Voyage", "Des vacances moyennes laissent un bon souvenir grâce au dernier jour."], ["Santé", "Une coloscopie un peu plus longue mais qui finit en douceur est jugée moins pénible."], ["Consommation", "Un restaurant qui offre un petit dessert à la fin laisse une meilleure impression."]], "why": "La mémoire ne fait pas la moyenne de tous les moments : elle retient surtout le plus intense et le dernier. Le reste est résumé.", "tips": ["Soigner la fin d'une expérience (cours, réunion, rendez-vous).", "Pour juger une expérience passée, repenser à l'ensemble, pas seulement au pic et à la fin."]}, "Nivellement et affinement": {"ex": [["Vie quotidienne", "À chaque fois qu'on raconte une anecdote, elle devient plus courte, mais le détail spectaculaire grossit."], ["Médias", "Une rumeur perd ses nuances et garde ses éléments les plus frappants en circulant."], ["Science", "Dans des expériences de « téléphone arabe », une histoire se simplifie à chaque transmission."]], "why": "Pour mémoriser et transmettre, le cerveau simplifie : il supprime les détails jugés secondaires (nivellement) et accentue ceux qui lui paraissent importants (affinement).", "tips": ["Revenir à la source d'origine plutôt qu'à une version racontée.", "Se méfier des histoires trop nettes et trop frappantes."]}, "Effet de désinformation": {"ex": [["Justice", "Après avoir entendu « quand les voitures se sont écrasées », des témoins se souviennent de bris de verre qui n'existaient pas."], ["Médias", "Après avoir lu un récit erroné d'un événement auquel on a assisté, on finit par s'en souvenir ainsi."], ["Relations", "Une conversation après une fête modifie le souvenir qu'on garde de la soirée."]], "why": "Les informations reçues après un événement se mêlent au souvenir d'origine. Elizabeth Loftus a montré que la formulation d'une simple question peut suffire à le modifier.", "tips": ["Noter ses souvenirs le plus tôt possible après un événement important.", "Éviter de discuter avec d'autres témoins avant de témoigner."]}, "Effet de position dans une série": {"ex": [["Vie quotidienne", "Quand on récite une liste de courses dans l'ordre, ce sont les articles du milieu qui manquent."], ["Éducation", "On retient mieux le début et la fin d'une récitation que le milieu."], ["Travail", "Dans une présentation, on se souvient surtout de la première et de la dernière diapositive."]], "why": "Les premiers éléments ont été répétés plus longtemps et ont eu le temps de s'installer en mémoire ; les derniers sont encore « frais ». Le milieu ne bénéficie d'aucun de ces avantages.", "tips": ["Placer les informations importantes au début et à la fin.", "Réviser en priorité le milieu des listes et des cours."]}, "Effet de la longueur de la liste": {"ex": [["Vie quotidienne", "On retient presque toute une liste de 5 mots, mais seulement une partie d'une liste de 30."], ["Éducation", "Un cours avec 20 définitions est moins bien retenu, en proportion, qu'un cours avec 5."], ["Interface", "Un menu trop long fait oublier les options présentées au milieu."]], "why": "Plus une liste est longue, plus les éléments se font concurrence en mémoire. On en retient davantage en nombre, mais une part plus faible.", "tips": ["Découper les longues listes en petits groupes.", "Ne garder que l'essentiel dans les supports à mémoriser."]}, "Négligence de la durée": {"ex": [["Santé", "Un examen médical un peu plus long mais qui finit en douceur est jugé moins pénible qu'un examen plus court."], ["Voyage", "On garde le même souvenir d'un séjour de trois jours ou d'une semaine s'il a eu les mêmes moments forts."], ["Travail", "Une réunion longue mais qui se termine bien laisse un meilleur souvenir qu'une courte qui finit mal."]], "why": "Notre souvenir d'une expérience se résume surtout à son moment le plus intense et à sa fin. La durée totale est presque ignorée.", "tips": ["Pour comparer deux expériences, tenir compte aussi de leur durée.", "Ne pas sacrifier une longue période agréable pour un moment fort isolé."]}, "Effet de la modalité": {"ex": [["Vie quotidienne", "On retient mieux la fin d'une liste de courses dictée à voix haute que celle d'une liste lue sur un papier."], ["Éducation", "Combiner explication orale et schéma aide plus que le texte et le schéma ensemble."], ["Travail", "Un numéro donné au téléphone se retient bien quelques secondes, mieux que lu sur un écran."]], "why": "Les sons laissent une brève trace dans la mémoire auditive, qui aide à retenir les derniers éléments entendus. La présentation (orale ou écrite) change ce qu'on retient.", "tips": ["Répéter à voix haute ce qu'on veut retenir à court terme.", "Varier les formats (oral, écrit, visuel) pour mieux apprendre."]}, "Inhibition de la mémoire": {"ex": [["Vie quotidienne", "Après avoir changé de code de carte bancaire, on a du mal à retrouver l'ancien."], ["Éducation", "Réviser certains points d'un chapitre peut rendre plus difficile le rappel des autres points non révisés."], ["Langues", "En parlant une nouvelle langue, on a du mal à retrouver les mots d'une autre langue apprise."]], "why": "Le cerveau doit écarter les informations concurrentes pour retrouver celle qu'il cherche. Cette mise à l'écart rend ensuite les informations écartées plus difficiles à retrouver.", "tips": ["Réviser l'ensemble d'un chapitre, pas seulement quelques points.", "Utiliser des indices distincts pour des informations proches."]}, "Effet de primauté": {"ex": [["Travail", "Dans un entretien d'embauche, la première impression pèse plus que tout le reste."], ["Politique", "Le premier candidat sur un bulletin bénéficie d'un léger avantage."], ["Éducation", "On retient mieux les premiers mots d'une liste."]], "why": "Les premiers éléments reçoivent plus d'attention et de répétition mentale. Ils servent aussi de cadre pour interpréter la suite.", "tips": ["Retarder son jugement jusqu'à avoir toutes les informations.", "Varier l'ordre de présentation quand on évalue plusieurs options."]}, "Effet de récence": {"ex": [["Politique", "Après des présentations successives, le dernier candidat entendu est mieux retenu."], ["Travail", "Lors d'une évaluation annuelle, les derniers mois pèsent plus que le début d'année."], ["Finance", "Les investisseurs accordent trop de poids aux performances récentes d'un placement."]], "why": "Les éléments récents sont encore présents dans la mémoire de travail. Ils sont donc plus faciles à retrouver et paraissent plus importants.", "tips": ["Noter les faits importants tout au long de la période à évaluer.", "Regarder les tendances sur une longue durée, pas seulement les derniers résultats."]}, "Indiçage partiel": {"ex": [["Éducation", "Si l'on vous souffle quelques pays d'Europe, vous retrouvez moins bien les autres que si l'on ne vous en souffle aucun."], ["Justice", "Montrer quelques indices à un témoin peut gêner le rappel des autres détails."], ["Vie quotidienne", "Quand quelqu'un énumère une partie de la liste de courses, on peine à retrouver le reste."]], "why": "Les indices donnés activent certains souvenirs, qui font ensuite concurrence aux autres et perturbent la stratégie qu'on aurait utilisée pour tout retrouver.", "tips": ["Essayer de se rappeler seul avant de consulter une liste partielle.", "Pour interroger un témoin, commencer par un récit libre."]}, "Effet de position sérielle": {"ex": [["Vie quotidienne", "Après une liste de dix courses, on se souvient du pain et du lait (au début et à la fin) mais pas des œufs au milieu."], ["Consommation", "Dans une dégustation, les premiers et derniers vins goûtés sont mieux notés."], ["Médias", "Dans un journal télévisé, on retient surtout le premier et le dernier sujet."]], "why": "Il combine l'effet de primauté (les premiers éléments sont mieux installés en mémoire) et l'effet de récence (les derniers sont encore frais). Hermann Ebbinghaus l'a décrit dès la fin du XIXᵉ siècle.", "tips": ["Placer les informations clés au début et à la fin.", "Réviser en priorité les éléments du milieu."]}, "Effet du suffixe": {"ex": [["Vie quotidienne", "Si quelqu'un dit « voilà » après une liste de chiffres dictée, on retient moins bien le dernier chiffre."], ["Travail", "Un bruit juste après qu'on nous a donné un numéro de téléphone fait oublier les derniers chiffres."], ["Éducation", "Une remarque orale ajoutée juste après une consigne fait oublier la fin de la consigne."]], "why": "Le dernier élément entendu est gardé brièvement dans la mémoire auditive. Un son ajouté juste après vient « écraser » cette trace.", "tips": ["Laisser un court silence après une information importante donnée à l'oral.", "Noter tout de suite un numéro ou une consigne entendus."]}, "Distraction": {"ex": [["Vie quotidienne", "On pose ses clés en pensant à autre chose, et on ne se souvient plus où."], ["Numérique", "On ne retient pas une conversation pendant laquelle on regardait son téléphone."], ["Santé", "On ne se rappelle plus si l'on a pris son médicament ce matin."]], "why": "Pour qu'un souvenir se forme, il faut y prêter attention au moment où il se produit. Quand l'attention est ailleurs, l'information n'est tout simplement pas enregistrée.", "tips": ["Ranger les objets importants toujours au même endroit.", "Faire une chose à la fois quand on veut s'en souvenir."]}, "Effet test": {"ex": [["Éducation", "Se faire interroger sur un cours aide plus à le retenir que de le relire une fois de plus."], ["Langues", "Essayer de traduire sans regarder la réponse fait mieux progresser que relire le vocabulaire."], ["Travail", "Résumer une réunion de mémoire aide à en retenir le contenu."]], "why": "Chaque fois qu'on va chercher une information dans sa mémoire, on renforce le chemin qui y mène. Relire donne une impression de maîtrise, mais renforce peu la mémoire.", "tips": ["Réviser en se testant : questions, cartes, exercices sans regarder les réponses.", "Se réciter un cours de mémoire avant de le relire."]}, "Effet au-suivant": {"ex": [["Travail", "Lors d'un tour de table, on oublie ce qu'a dit la personne qui parlait juste avant nous."], ["Éducation", "En classe, un élève qui attend d'être interrogé ne suit pas ce que dit son camarade."], ["Vie quotidienne", "Lors des présentations dans un groupe, on oublie le prénom de la personne juste avant nous."]], "why": "En attendant son tour, l'attention se concentre sur ce qu'on va dire et sur le stress de parler. L'information qui arrive à ce moment-là n'est pas bien enregistrée.", "tips": ["Préparer son intervention à l'avance pour être disponible pendant que les autres parlent.", "Noter ce que dit la personne avant soi."]}, "Effet Google": {"ex": [["Numérique", "On ne connaît plus aucun numéro de téléphone par cœur."], ["Éducation", "On retient moins une information quand on sait qu'on pourra la retrouver en ligne."], ["Vie quotidienne", "On se souvient où trouver une recette, mais pas de la recette elle-même."]], "why": "Le cerveau économise ses efforts : si une information est facilement accessible ailleurs, il retient plutôt où la trouver que l'information elle-même. Les chercheurs parlent de « délestage cognitif ».", "tips": ["Apprendre par cœur ce dont on a souvent besoin sans écran.", "Se tester avant de chercher une information en ligne."]}, "Mot sur le bout de la langue": {"ex": [["Vie quotidienne", "On sait que le nom de l'acteur commence par un « B » et a deux syllabes, mais impossible de le retrouver."], ["Langues", "En parlant une langue étrangère, un mot connu nous échappe au moment de l'utiliser."], ["Santé", "Ce phénomène devient plus fréquent avec l'âge, sans être en soi un signe de maladie."]], "why": "On accède au sens du mot, mais pas complètement à sa forme (ses sons). Le souvenir est partiellement activé, ce qui donne la sensation qu'il est tout proche.", "tips": ["Passer à autre chose : le mot revient souvent tout seul quelques minutes plus tard.", "Parcourir l'alphabet ou chercher des mots proches pour réactiver la forme."]}, "Effet de profondeur du traitement": {"ex": [["Éducation", "On retient mieux un mot quand on s'est demandé ce qu'il signifie que quand on a seulement compté ses lettres."], ["Travail", "On se souvient mieux d'un dossier qu'on a discuté et critiqué que d'un dossier seulement survolé."], ["Langues", "Utiliser un mot nouveau dans une phrase personnelle aide plus que le répéter."]], "why": "Selon Craik et Lockhart (1972), plus on traite une information en profondeur (son sens, ses liens avec ce qu'on sait), plus la trace en mémoire est solide.", "tips": ["Se poser des questions sur le sens : pourquoi, comment, quel lien avec ce que je sais ?", "Expliquer ce qu'on apprend à quelqu'un d'autre."]}, "Biais rétrospectif": {"ex": [["Vie quotidienne", "« Je le savais depuis le début » après un résultat sportif ou électoral."], ["Santé", "Après un diagnostic tardif, on juge que les premiers symptômes « étaient évidents », alors qu'ils étaient ambigus."], ["Justice", "Une fois l'accident survenu, des jurés estiment que le risque était facile à prévoir."]], "why": "Une fois qu'on connaît le résultat, il s'intègre à notre compréhension de la situation, et on ne peut plus se souvenir de notre incertitude de départ. L'histoire paraît alors logique et prévisible.", "tips": ["Noter ses prévisions avant de connaître le résultat.", "Juger une décision passée avec les informations disponibles à l'époque, pas avec celles d'aujourd'hui."]}};
const $=s=>document.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const D=ms=>reduce?0:ms, E='cubic-bezier(.22,.8,.24,1)', DUR=560;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vp=$('#vp'),home=$('#home'),fam=$('#fam'),mot=$('#mot'),det=$('#det');

/* Teintes : t=0 le plus sombre, t=1 le plus clair */
const shade=(c,t)=>t<.5?`color-mix(in oklab,var(${c}),var(--deep) ${Math.round((.5-t)*60)}%)`:`color-mix(in oklab,var(${c}),#F7F3FF ${Math.round((t-.5)*96)}%)`;
const hd=c=>`color-mix(in oklab,var(${c}),var(--deep) 38%)`;
const lightAt=t=>t>.78;
const count=f=>f.m.reduce((a,m)=>a+m[1].length,0);

/* ---- Niveau 1 : courants ---- */
home.querySelector('.blocks').innerHTML=FAM.map((f,i)=>`<button class="block mv" data-f="${i}" style="--bg:var(${f.c})">
  <span class="q">${esc(f.q)}</span><b>${esc(f.name)}</b><span class="peek">${f.m.length} motifs</span><span class="n">${count(f)} biais</span></button>`).join('');

/* ---- Niveau 2 : motifs du courant, en gros blocs ---- */
let F=0,M=0;
function renderFam(fi){
  F=fi;const f=FAM[fi],n=f.m.length;
  fam.style.setProperty('--hd',hd(f.c));
  fam.innerHTML=`<div class="fhead mv"><button class="back in" data-back>‹ Courants</button><h3>${esc(f.name)}</h3><p class="in">${count(f)} biais · ${n} motifs</p></div>
  <div class="blocks">${f.m.map((m,i)=>{const t=.12+.72*i/(n-1);
    return `<button class="block motif mv in${lightAt(t)?' light':''}" data-m="${i}" style="--bg:${shade(f.c,t)}" data-t="${t}">
      <span class="n">${m[1].length}</span><b>${esc(m[0])}</b></button>`}).join('')}</div>`;
}

/* ---- Niveau 3 : biais du motif ---- */
function renderMot(mi){
  M=mi;const f=FAM[F],m=f.m[mi],N=m[1].length;
  mot.style.setProperty('--hd',hd(f.c));mot.style.setProperty('--end',shade(f.c,1));
  mot.innerHTML=`<div class="fhead mv"><button class="back in" data-back>‹ ${esc(f.name)}</button><h3>${esc(m[0])}</h3><p class="in">${N} biais</p></div>
  <div class="list">${m[1].map((b,k)=>{const t=.1+.85*k/Math.max(1,N-1);
    return `<button class="row st mv in${lightAt(t)?' light':''}" data-b="${esc(b)}" style="--bg:${shade(f.c,t)};--k:${k}"><span>${esc(b)}</span></button>`}).join('')}<div class="spacer"></div></div>`;
  const list=mot.querySelector('.list'),sts=$$('.st',list);
  requestAnimationFrame(()=>{
    sts.forEach(el=>{el._top=el.offsetTop;el._stick=Math.min(+el.style.getPropertyValue('--k'),12)*4});
    list.addEventListener('scroll',()=>{const s=list.scrollTop;
      sts.forEach(el=>{const p=Math.max(0,Math.min(1,(s+el._stick-el._top)/el.offsetHeight));if(el._p!==p){el._p=p;el.style.setProperty('--p',p.toFixed(3))}})},{passive:true});
  });
}

/* ---- Fiche ---- */
/* Sources scientifiques : chargées à part (sources.json), issues de Semantic Scholar */
let SCH=null;
fetch('sources.json').then(r=>r.json()).then(j=>{SCH=j;if(!det.hidden&&det._n)fillSources(det._n)}).catch(()=>{});
const DOMS={sante:'Santé',politique:'Politique',croyances:'Croyances et idéologies',economie:'Économie',travail:'Entreprise et management',justice:'Droit et justice',education:'Éducation',numerique:'Numérique et IA',societe:'Société'};
const nf=new Intl.NumberFormat('fr-FR');
function cite(p){
  const au=(p.a||[]).join(', ')+(p.more?' et al.':'');
  return `<a class="paper" href="${esc(p.u||p.doi||'#')}" target="_blank" rel="noopener"><span class="pt">${esc(p.t||'Sans titre')}</span>
  <span class="pm">${esc(au)}${p.y?' · '+p.y:''}${p.v?' · <i>'+esc(p.v)+'</i>':''}</span>
  <span class="pc">Accès libre · cité ${nf.format(p.c||0)} fois</span></a>`;
}
function fillSources(n){
  const box=det.querySelector('#srcbox');if(!box)return;
  if(!SCH){box.innerHTML='<p class="todo">Chargement des sources…</p>';return}
  const s=SCH[n],q=s&&s.q?s.q:n;
  if(!s){box.innerHTML='<h5 class="more">Pour aller plus loin</h5><p class="todo">Les articles scientifiques de ce biais sont en cours d\'ajout.</p>';return}
  const scholar='https://scholar.google.com/scholar?q='+encodeURIComponent('"'+q+'"');
  const wiki=SRC[n];
  const doms=s?Object.entries(s.dom).filter(([,v])=>v.n>0&&v.p).sort((a,b)=>b[1].n-a[1].n):[];
  box.innerHTML=`
   <h5 class="more">Pour aller plus loin</h5>
   ${doms.length?`<section><h4>Domaines de recherche</h4>
     <p class="mech">Nombre d'études en accès libre sur ce biais dans chaque domaine${s.total>s.sample?` (parmi les ${nf.format(s.sample)} plus citées)`:''}. Touchez un domaine pour voir son étude la plus citée.</p>
     <div class="doms">${doms.map(([k,v],i)=>`<button class="dom" data-dom="${k}" aria-pressed="${i===0}">${DOMS[k]}<span>${nf.format(v.n)}</span></button>`).join('')}</div>
     <div class="domp papers">${cite(doms[0][1].p)}</div></section>`:''}
   <section><h4>Sources scientifiques</h4>
     ${s&&s.papers.length?`<p class="mech">${s.total?`<b>${nf.format(s.total)} études</b> en accès libre portent sur ce biais dans Semantic Scholar. `:''}Les plus citées :</p>
     <div class="papers">${s.papers.map(cite).join('')}</div>`:`<p class="mech">Aucune étude en accès libre trouvée sous ce nom ; les liens ci-dessous ouvrent une recherche plus large.</p>`}
     <div class="links"><a class="lnk" href="${esc(scholar)}" target="_blank" rel="noopener">Toutes les études sur Google Scholar ›</a>
     ${wiki?`<a class="lnk" href="${esc(wiki)}" target="_blank" rel="noopener">Article Wikipédia ›</a>`:''}</div>
     <p class="srcl">Études issues de Semantic Scholar (moteur de recherche scientifique de l'Allen Institute for AI), en accès libre, triées par nombre de citations. La définition s'appuie sur l'article Wikipédia lié par le Cognitive Bias Codex.</p>
   </section>`;
}
det.addEventListener('click',e=>{
  const b=e.target.closest('[data-dom]');if(!b||!SCH)return;
  const s=SCH[det._n];if(!s)return;
  det.querySelectorAll('[data-dom]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  const p=det.querySelector('.domp');p.innerHTML=cite(s.dom[b.dataset.dom].p);
  p.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:D(260),easing:E});
});
function renderDet(n,bg,light){
  const f=FAM[F],m=f.m[M],d=DEF[n],fx=FICHE[n];
  det.style.setProperty('--bg',bg);det.style.setProperty('--lab',`color-mix(in oklab,var(${f.c}),var(--deep) 28%)`);det.classList.toggle('light',light);
  det._n=n;
  det.innerHTML=`<div class="dwrap">
   <div class="dhead"><button class="back in" data-back>‹ Retour à la liste</button><span class="crumb in">${esc(f.name)}</span><h3>${esc(n)}</h3></div>
   <div class="sheet in">
    <section><h4>En une phrase</h4>${d?`<p class="def">${esc(d[0])}</p>`:`<p class="todo">Définition à rédiger pour cette maquette.</p>`}</section>
    ${fx?`<section><h4>Exemples dans la vraie vie</h4><ul class="exs">${fx.ex.map(([dom,t])=>`<li><span class="exd">${esc(dom)}</span><span>${esc(t)}</span></li>`).join('')}</ul></section>`
       :(d&&d[1]?`<section><h4>Exemple</h4><blockquote>${esc(d[1])}</blockquote></section>`:'')}
    ${fx?`<section><h4>Pourquoi notre cerveau fait ça</h4><p class="why2">${esc(fx.why)}</p><p class="fam2">Famille : ${esc(m[0])}.</p></section>`
       :`<section><h4>Pourquoi on y tombe</h4><p class="mech">${esc(m[0])}.</p></section>`}
    ${fx?`<section><h4>Comment s'en protéger</h4><ul class="tips">${fx.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`:''}
    <div id="srcbox"></div>
   </div></div>`;
  fillSources(n);
}

/* ---- Ouverture / fermeture : même geste à chaque niveau ----
   Le bloc touché s'agrandit jusqu'aux bords. Tout ce qui est au-dessus monte d'un seul mouvement,
   tout ce qui est en dessous descend d'un seul mouvement : deux groupes, deux destins. */
const stack=[];let busy=false;
/* Écarte les éléments autour du bloc touché et retient lesquels ont bougé, pour les remettre exactement en place au retour */
function split(parent,from){
  const V=vp.getBoundingClientRect(),r=from.getBoundingClientRect(),up=r.top-V.top,down=V.bottom-r.bottom,moved=[];
  $$('.mv',parent).forEach(el=>{if(el===from)return;const er=el.getBoundingClientRect();if(er.bottom<=V.top||er.top>=V.bottom)return;
    el.getAnimations().forEach(a=>a.cancel());
    const tr=`translateY(${er.top<r.top?-up:down}px)`;moved.push([el,tr]);
    el.animate([{transform:'none'},{transform:tr}],{duration:D(DUR),easing:E,fill:'forwards'})});
  return {up,down,moved};
}
function unsplit(moved){
  moved.forEach(([el,tr])=>{el.getAnimations().forEach(a=>a.cancel());
    el.animate([{transform:tr},{transform:'none'}],{duration:D(DUR-40),easing:E})});
}
/* Le titre du bloc touché glisse jusqu'à sa place en haut du nouvel écran (même élément, perçu comme continu) */
function flyTitle(src,dst,back){
  if(!src||!dst)return;
  const a=src.getBoundingClientRect(),b=dst.getBoundingClientRect();
  const k=parseFloat(getComputedStyle(src).fontSize)/parseFloat(getComputedStyle(dst).fontSize);
  const at=`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${k})`;
  dst.style.transformOrigin='0 0';
  dst.animate(back?[{transform:'none'},{transform:at}]:[{transform:at},{transform:'none'}],{duration:D(back?DUR-60:DUR),easing:E,fill:back?'forwards':'none'});
}
function push(parent,from,scr){
  busy=true;
  const {up,down,moved}=split(parent,from);
  /* le nouvel écran démarre dans la couleur exacte du bloc touché : plus de fond sombre visible */
  const col=getComputedStyle(from).backgroundColor;
  scr.style.background=col;scr.hidden=false;scr.style.zIndex=stack.length+2;
  scr.animate([{clipPath:`inset(${up}px 0 ${down}px 0)`},{clipPath:'inset(0 0 0 0)'}],{duration:D(DUR),easing:E});
  const head=scr.querySelector('.fhead');
  if(head)head.animate([{backgroundColor:col},{backgroundColor:getComputedStyle(head).backgroundColor}],{duration:D(DUR),easing:E});
  flyTitle(from.querySelector('b')||from.querySelector('span'),scr.querySelector('h3'));
  /* le reste du niveau suivant arrive d'un bloc : tous ses éléments ont la même trajectoire */
  $$('.in',scr).forEach(el=>el.animate([{transform:'translateY(28px)',opacity:0},{transform:'none',opacity:1}],{duration:D(460),delay:D(120),easing:E,fill:'backwards'}));
  stack.push({parent,from,scr,up,down,moved});
  setTimeout(()=>{busy=false},D(DUR+20));
}
function pop(){
  if(busy||!stack.length)return;busy=true;
  const {scr,up,down,moved,from}=stack.pop();
  unsplit(moved);
  /* au retour : le contenu s'efface, l'écran redevient la couleur du bloc et se referme sur lui */
  const col=getComputedStyle(from).backgroundColor;
  $$('.in',scr).forEach(el=>{el.getAnimations().forEach(a=>a.cancel());el.animate([{opacity:1},{opacity:0}],{duration:D(200),easing:'ease-out',fill:'forwards'})});
  const head=scr.querySelector('.fhead');
  if(head)head.animate([{backgroundColor:getComputedStyle(head).backgroundColor},{backgroundColor:col}],{duration:D(DUR-60),easing:E,fill:'forwards'});
  flyTitle(from.querySelector('b')||from.querySelector('span'),scr.querySelector('h3'),true);
  let finished=false;
  /* à la fin, on force l'état final : écran fermé, blocs du niveau précédent remis à leur place */
  const done=()=>{if(finished)return;finished=true;scr.hidden=true;
    [scr,...scr.querySelectorAll('*')].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
    moved.forEach(([el])=>el.getAnimations().forEach(a=>a.cancel()));busy=false};
  scr.animate([{clipPath:'inset(0 0 0 0)'},{clipPath:`inset(${up}px 0 ${down}px 0)`}],{duration:D(DUR-40),easing:E,fill:'forwards'}).onfinish=done;
  setTimeout(done,D(DUR)+80); /* filet de sécurité si l'animation est interrompue */
}
function swapDet(n){
  const top=stack[stack.length-1],row=$$('.row',mot).find(r=>r.dataset.b===n);if(!row)return;
  top.moved.forEach(([el])=>el.getAnimations().forEach(a=>a.cancel()));
  renderDet(n,row.style.getPropertyValue('--bg'),row.classList.contains('light'));det.style.background=getComputedStyle(row).backgroundColor;
  const s=split(mot,row);Object.assign(top,{from:row,up:s.up,down:s.down,moved:s.moved});
  det.querySelector('.dwrap').animate([{transform:'translateX(40px)',opacity:0},{transform:'none',opacity:1}],{duration:D(420),easing:E});
}

$('#sw').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||busy)return;
  if(t.dataset.f!==undefined){renderFam(+t.dataset.f);push(home,t,fam)}
  else if(t.dataset.m!==undefined){renderMot(+t.dataset.m);push(fam,t,mot)}
  else if(t.dataset.b){renderDet(t.dataset.b,t.style.getPropertyValue('--bg'),t.classList.contains('light'));push(mot,t,det)}
  else if(t.dataset.s)swapDet(t.dataset.s);
  else if(t.hasAttribute('data-back'))pop();
});



/* ---- Retour système (geste ou bouton « retour » du téléphone) ----
   Chaque ouverture ajoute une étape à l'historique ; revenir en arrière referme le niveau ouvert. */
const _push=push;
push=function(parent,from,scr){_push(parent,from,scr);history.pushState({depth:stack.length},'')};
function popWhenReady(){if(!stack.length)return;if(busy){setTimeout(popWhenReady,120);return}pop()}
addEventListener('popstate',popWhenReady);
document.getElementById('sw').addEventListener('click',e=>{
  const t=e.target.closest('[data-back]');if(!t)return;
  e.stopImmediatePropagation();if(!busy&&stack.length)history.back();
},true);

/* ---- Hors connexion ---- */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
